<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b101d" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='26' cy='32' r='22' fill='%23111827' stroke='%23e8b45a' stroke-width='2.5'/><circle cx='38' cy='32' r='22' fill='%23f8fafc' stroke='%23e8b45a' stroke-width='2.5' opacity='.92'/></svg>" />
  <title>弈境 · AI 五子棋</title>
  <style>
    /* ============================================================
       弈境 · AI 五子棋 — 设计系统
       深邃棋盘 + 柔和琥珀高光，暗色高级质感
       ============================================================ */
    :root {
      /* 色彩 Tokens */
      --bg-0: #070b14;
      --bg-1: #0c1220;
      --bg-2: #121a2d;
      --surface: #131c30;
      --surface-2: #1a2540;
      --surface-3: #223052;
      --line: rgba(148, 163, 184, 0.13);
      --line-strong: rgba(148, 163, 184, 0.26);
      --text-1: #e9eef7;
      --text-2: #9aa7bd;
      --text-3: #5d6b84;
      --amber: #e8b45a;
      --amber-2: #f6cf85;
      --amber-dim: rgba(232, 180, 90, 0.14);
      --cyan: #6fd3ff;
      --green: #3ddc97;
      --red: #ff6b6b;
      --danger-dim: rgba(255, 107, 107, 0.13);

      /* 棋盘 Tokens */
      --board-line: rgba(228, 190, 138, 0.30);
      --board-star: rgba(240, 205, 155, 0.55);
      --board-wood:
        radial-gradient(130% 140% at 30% 0%, #473323 0%, #382614 45%, #27180c 78%, #180d05 100%);
      --board-grain:
        repeating-linear-gradient(93deg, rgba(0, 0, 0, 0.055) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(3deg, rgba(0, 0, 0, 0.03) 0 2px, transparent 2px 7px);

      /* 间距 / 圆角 / 阴影 */
      --radius: 16px;
      --radius-sm: 10px;
      --shadow-lg: 0 24px 48px -14px rgba(0, 0, 0, 0.62);
      --shadow-md: 0 10px 24px -10px rgba(0, 0, 0, 0.55);
      --shadow-glow: 0 0 0 1px rgba(232, 180, 90, 0.35), 0 6px 24px -6px rgba(232, 180, 90, 0.35);

      /* 动效 */
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.4, 0.44, 1);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --font-mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--font);
      color: var(--text-1);
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(232, 180, 90, 0.10), transparent 60%),
        radial-gradient(900px 500px at 85% 110%, rgba(111, 211, 255, 0.06), transparent 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    #app { animation: pageIn 0.4s var(--ease-out) both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    ::selection { background: rgba(232, 180, 90, 0.30); }

    /* ---------- 顶栏 ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px clamp(14px, 4vw, 32px);
      background: rgba(11, 16, 29, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-1); }
    .brand-logo { position: relative; width: 34px; height: 34px; flex-shrink: 0; }
    .brand-logo::before, .brand-logo::after {
      content: ""; position: absolute; top: 50%; width: 24px; height: 24px; border-radius: 50%;
      transform: translateY(-50%);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 -2px 4px rgba(0, 0, 0, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.35);
    }
    .brand-logo::before { left: 1px; background: radial-gradient(circle at 32% 28%, #94a3b8, #0b1220 75%); }
    .brand-logo::after { right: 1px; background: radial-gradient(circle at 32% 28%, #ffffff, #c9d3e0 75%); }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; }
    .brand-name em { font-style: normal; color: var(--amber); }
    .brand-sub { font-size: 10px; letter-spacing: 0.42em; color: var(--text-3); margin-top: 2px; text-transform: uppercase; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .game-chip {
      font-size: 12px; color: var(--text-2); background: var(--surface);
      border: 1px solid var(--line-strong); padding: 5px 12px; border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- 按钮 ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1;
      padding: 11px 20px; border-radius: var(--radius-sm);
      border: 1px solid transparent; cursor: pointer; white-space: nowrap;
      transition: transform 0.16s var(--ease-out), box-shadow 0.16s var(--ease-out),
                  background-color 0.16s, color 0.16s, border-color 0.16s, opacity 0.16s;
      user-select: none; touch-action: manipulation;
    }
    .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .btn:active { transform: scale(0.965); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--amber-2), var(--amber) 55%, #d99a3d);
      color: #241503;
    }
    .btn-primary:not(:disabled):hover { transform: translateY(-1px); box-shadow: var(--shadow-glow); }
    .btn-ghost { background: var(--surface-2); color: var(--text-1); border-color: var(--line-strong); }
    .btn-ghost:not(:disabled):hover { background: var(--surface-3); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-danger { background: var(--danger-dim); color: #ff9a9a; border-color: rgba(255, 107, 107, 0.35); }
    .btn-danger:not(:disabled):hover { background: rgba(255, 107, 107, 0.22); transform: translateY(-1px); }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .btn .spinner { width: 14px; height: 14px; border-width: 2px; }

    /* ---------- 首页 ---------- */
    .home-wrap { max-width: 980px; margin: 0 auto; padding: clamp(20px, 5vw, 48px) clamp(14px, 4vw, 32px) 64px; }
    .hero { text-align: center; margin-bottom: clamp(22px, 4vw, 40px); }
    .hero-title {
      font-size: clamp(28px, 6vw, 44px); font-weight: 800; letter-spacing: 0.04em; line-height: 1.25;
      background: linear-gradient(120deg, #fdf3de 0%, var(--amber-2) 40%, #b98a3f 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero-sub { margin-top: 10px; color: var(--text-2); font-size: clamp(13px, 2.4vw, 15px); letter-spacing: 0.12em; }
    .hero-chips { display: flex; justify-content: center; gap: 14px; margin-top: 18px; }
    .hero-chips .chip { width: 26px; height: 26px; }

    .chip { display: inline-block; width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5), inset 0 -2px 4px rgba(0, 0, 0, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.4); }
    .chip-black { background: radial-gradient(circle at 32% 28%, #94a3b8, #0b1220 78%); }
    .chip-white { background: radial-gradient(circle at 32% 28%, #ffffff, #c9d3e0 78%); }

    .card {
      background: linear-gradient(180deg, var(--surface) 0%, rgba(19, 28, 48, 0.72) 100%);
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }
    .card-head { padding: 18px 22px 0; display: flex; align-items: center; gap: 10px; }
    .card-head h2 { font-size: 16px; font-weight: 700; letter-spacing: 0.06em; }
    .card-head .hint { margin-left: auto; font-size: 12px; color: var(--text-3); }

    .create-card { padding-bottom: 20px; margin-bottom: 28px; }
    .create-body { padding: 18px 22px 0; }

    .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line-strong);
      border-radius: 12px; padding: 4px; gap: 4px; }
    .seg-item {
      border: 0; background: transparent; color: var(--text-2); font-family: inherit; font-size: 13.5px; font-weight: 600;
      padding: 8px 18px; border-radius: 9px; cursor: pointer; transition: all 0.2s var(--ease-out);
      display: inline-flex; align-items: center; gap: 7px; touch-action: manipulation;
    }
    .seg-item:hover { color: var(--text-1); }
    .seg-item.active {
      background: linear-gradient(135deg, var(--amber-2), var(--amber) 60%, #d99a3d);
      color: #241503; box-shadow: 0 4px 14px -4px rgba(232, 180, 90, 0.5);
    }

    .seat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
    .seat {
      background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 12px;
      padding: 14px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .seat:focus-within { border-color: rgba(232, 180, 90, 0.5); box-shadow: 0 0 0 3px var(--amber-dim); }
    .seat-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3);
      letter-spacing: 0.14em; margin-bottom: 9px; font-weight: 600; }
    .seat select, .field select, .input, .select {
      width: 100%; background: #0e1526; color: var(--text-1);
      border: 1px solid var(--line-strong); border-radius: 9px;
      padding: 9px 12px; font-family: inherit; font-size: 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .seat select:focus, .field select:focus, .input:focus, .select:focus {
      border-color: rgba(232, 180, 90, 0.55); box-shadow: 0 0 0 3px var(--amber-dim);
    }
    .create-actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
    .create-hint { font-size: 12px; color: var(--text-3); margin-top: 12px; }

    .rooms-section h2 { font-size: 15px; letter-spacing: 0.1em; color: var(--text-2); margin-bottom: 12px; font-weight: 700; }
    .room-list { display: flex; flex-direction: column; gap: 10px; }
    .room-card {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px;
      background: linear-gradient(180deg, var(--surface) 0%, rgba(19, 28, 48, 0.66) 100%);
      border: 1px solid var(--line); border-radius: 12px;
      transition: transform 0.18s var(--ease-out), border-color 0.18s, box-shadow 0.18s;
    }
    .room-card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
    .room-info { flex: 1; min-width: 0; }
    .room-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14.5px; }
    .room-meta { margin-top: 5px; font-size: 12.5px; color: var(--text-3); display: flex; gap: 14px; flex-wrap: wrap; }
    .room-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px; letter-spacing: 0.05em;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge-waiting { background: var(--amber-dim); color: var(--amber); }
    .badge-playing { background: rgba(111, 211, 255, 0.13); color: var(--cyan); }
    .badge-finished { background: rgba(148, 163, 184, 0.13); color: var(--text-2); }
    .badge-mode { background: var(--surface-3); color: var(--text-2); }
    .badge-mode::before { display: none; }

    .empty { text-align: center; color: var(--text-3); font-size: 13.5px; padding: 34px 0 10px; }
    .empty-emoji { font-size: 30px; display: block; margin-bottom: 10px; opacity: 0.8; }

    /* ---------- 对局页 ---------- */
    .game-layout {
      max-width: 1160px; margin: 0 auto; padding: clamp(14px, 3vw, 26px) clamp(12px, 3vw, 30px) 56px;
      display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: clamp(16px, 2.5vw, 26px);
      align-items: start;
    }
    .game-main { min-width: 0; }

    .playerbar {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 12px; align-items: center; margin-bottom: 16px;
    }
    .player-card {
      display: flex; align-items: center; gap: 11px; padding: 11px 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
      min-width: 0; transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }
    .player-card .p-name { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-card .p-role { font-size: 11px; color: var(--text-3); letter-spacing: 0.1em; margin-top: 2px; }
    .player-card.active {
      border-color: rgba(232, 180, 90, 0.6); background: linear-gradient(180deg, #1e2a47, var(--surface));
      box-shadow: 0 0 0 3px var(--amber-dim), var(--shadow-md);
    }
    .player-card .p-status { margin-left: auto; display: none; }
    .player-card.active .p-status { display: block; }

    .turn-badge {
      text-align: center; font-size: 12.5px; font-weight: 700; color: var(--amber);
      letter-spacing: 0.08em; white-space: nowrap;
      display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 0 2px;
    }
    .turn-badge .tb-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--amber);
      box-shadow: 0 0 10px 1px rgba(232, 180, 90, 0.75);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .spinner {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid rgba(232, 180, 90, 0.25); border-top-color: var(--amber);
      animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 棋盘 */
    .board-wrap { position: relative; }
    .board-frame {
      background: linear-gradient(155deg, #31200f 0%, #1d1207 55%, #140b04 100%);
      border: 1px solid rgba(232, 180, 90, 0.14);
      padding: clamp(8px, 1.8vw, 14px); border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), var(--shadow-lg);
    }
    .board-grid {
      display: grid; grid-template-columns: repeat(15, 1fr);
      aspect-ratio: 1 / 1; width: 100%;
      border-radius: 6px; overflow: hidden;
      background-color: #1d1108;
      background-image:
        linear-gradient(to right, var(--board-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--board-line) 1px, transparent 1px),
        var(--board-grain),
        var(--board-wood);
      background-size: calc(100% / 15) 100%, 100% calc(100% / 15), auto, auto;
      background-repeat: repeat, repeat, repeat, no-repeat;
      user-select: none; -webkit-user-select: none;
    }
    .board-cell {
      position: relative; aspect-ratio: 1 / 1; min-width: 0;
      transition: background-color 0.18s;
    }
    .board-cell::before, .board-cell::after { pointer-events: none; }
    /* 星位 */
    .board-cell.star::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 11%; height: 11%;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: var(--board-star);
      box-shadow: 0 0 4px rgba(240, 205, 155, 0.35);
    }
    /* 悬停幽灵子 */
    .board-grid.turn-1 .board-cell:not(.has-stone):hover::before,
    .board-grid.turn-2 .board-cell:not(.has-stone):hover::before {
      content: ""; position: absolute; inset: 5%; border-radius: 50%; opacity: 0.42;
      transition: opacity 0.15s;
    }
    .board-grid.turn-1 .board-cell:not(.has-stone):hover::before {
      background: radial-gradient(circle at 32% 28%, #8b98ab, #0b1220 78%);
    }
    .board-grid.turn-2 .board-cell:not(.has-stone):hover::before {
      background: radial-gradient(circle at 32% 28%, #ffffff, #c3cedd 78%);
    }
    .board-grid.turn-1 .board-cell:not(.has-stone):hover,
    .board-grid.turn-2 .board-cell:not(.has-stone):hover { background-color: rgba(255, 255, 255, 0.05); cursor: pointer; }
    .board-grid.ai-turn .board-cell { cursor: not-allowed; }
    .board-grid.no-ghost .board-cell { cursor: default; }

    /* 棋子 */
    .stone {
      position: absolute; inset: 5%; border-radius: 50%; will-change: transform;
      box-shadow: 0 3px 7px rgba(0, 0, 0, 0.55), inset 0 -3px 5px rgba(0, 0, 0, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.28);
    }
    .stone--black { background: radial-gradient(circle at 32% 26%, #a3b0c2 0%, #4b5563 18%, #1f2937 55%, #05070d 100%); }
    .stone--white { background: radial-gradient(circle at 32% 26%, #ffffff 0%, #f1f5f9 32%, #cbd5e1 62%, #8b98ab 100%); }

    /* 落子动画 */
    .stone--new { animation: stoneDrop 0.34s var(--ease-spring) both; }
    .stone--new::after {
      content: ""; position: absolute; inset: -8%; border-radius: 50%;
      border: 2px solid rgba(232, 180, 90, 0.75);
      animation: stoneRing 0.5s ease-out forwards;
    }
    @keyframes stoneDrop {
      0% { transform: translateY(-16px) scale(0.35); opacity: 0; }
      60% { transform: translateY(2px) scale(1.07); opacity: 1; }
      80% { transform: translateY(-1px) scale(0.985); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes stoneRing { from { transform: scale(0.55); opacity: 0.95; } to { transform: scale(1.45); opacity: 0; } }

    /* 最近一步标记 */
    .stone--last::before {
      content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%;
      transform: translate(-50%, -50%); border-radius: 50%;
      box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.35);
    }
    .stone--black.stone--last::before { background: #f5c453; box-shadow: 0 0 12px 2px rgba(245, 196, 83, 0.8); }
    .stone--white.stone--last::before { background: #0f172a; box-shadow: 0 0 12px 2px rgba(15, 23, 42, 0.55); }

    /* 获胜连线 */
    .stone--win { animation: winPulse 1.3s ease-in-out infinite; }
    @keyframes winPulse {
      0%, 100% { box-shadow: 0 3px 7px rgba(0,0,0,.55), inset 0 -3px 5px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.28), 0 0 10px 2px rgba(232,180,90,.55); }
      50% { box-shadow: 0 3px 7px rgba(0,0,0,.55), inset 0 -3px 5px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.28), 0 0 22px 7px rgba(232,180,90,.95); }
    }

    /* 结果浮层 */
    .result-overlay {
      position: absolute; inset: 0; z-index: 20; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(7, 11, 20, 0.55);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      animation: fadeIn 0.3s var(--ease-out) both;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .result-card {
      text-align: center; padding: 28px 34px; border-radius: 18px;
      background: linear-gradient(180deg, #1b2540, #121a2d);
      border: 1px solid rgba(232, 180, 90, 0.35);
      box-shadow: var(--shadow-lg);
      animation: cardPop 0.4s var(--ease-spring) both;
      max-width: min(88%, 320px);
    }
    @keyframes cardPop { from { opacity: 0; transform: scale(0.8) translateY(14px); } to { opacity: 1; transform: none; } }
    .result-icon { font-size: 40px; line-height: 1; margin-bottom: 10px; }
    .result-title { font-size: clamp(20px, 4vw, 26px); font-weight: 800; letter-spacing: 0.06em;
      background: linear-gradient(120deg, #fdf3de, var(--amber-2) 50%, #d99a3d);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .result-sub { font-size: 12.5px; color: var(--text-3); margin: 8px 0 18px; }
    .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    /* 控制按钮行 */
    .game-controls { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    /* 侧栏 */
    .side-panel { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 76px; }
    .panel-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .panel-head { padding: 13px 16px; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-2);
      border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); }
    .stat-item { background: var(--surface-2); padding: 12px 14px; }
    .stat-label { font-size: 11px; color: var(--text-3); letter-spacing: 0.1em; margin-bottom: 4px; }
    .stat-value { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .stat-value .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-black { background: radial-gradient(circle at 32% 28%, #94a3b8, #0b1220 78%); }
    .dot-white { background: radial-gradient(circle at 32% 28%, #fff, #c9d3e0 78%); }
    .dot-amber { background: var(--amber); box-shadow: 0 0 8px rgba(232, 180, 90, 0.8); }

    .log-list { max-height: 420px; overflow-y: auto; padding: 10px 14px; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
    .log-list::-webkit-scrollbar { width: 6px; }
    .log-list::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
    .log-entry {
      font-size: 12px; color: var(--text-2); line-height: 1.5;
      padding: 6px 0; border-bottom: 1px dashed rgba(148, 163, 184, 0.12);
      word-break: break-all;
    }
    .log-entry:last-child { border-bottom: 0; }
    .log-empty { font-size: 12.5px; color: var(--text-3); padding: 16px 14px; text-align: center; }

    /* ---------- 配置页 ---------- */
    .config-wrap { max-width: 880px; margin: 0 auto; padding: clamp(20px, 4vw, 36px) clamp(14px, 4vw, 30px) 64px;
      display: flex; flex-direction: column; gap: 24px; }
    .config-sec { padding: 20px 22px 24px; }
    .config-sec h3 { font-size: 16px; font-weight: 700; letter-spacing: 0.05em; display: flex; align-items: center; gap: 9px; }
    .config-sec h3 .num { width: 22px; height: 22px; border-radius: 7px; background: var(--amber-dim); color: var(--amber);
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    /* ============ 历史页 ============ */
    .rank-list { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }
    .rank-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; background: var(--surface-2); border-radius: 8px; }
    .rank-row.rank-top { border: 1px solid rgba(232,180,90,.45); background: rgba(232,180,90,.07); }
    .rank-badge { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .rank-row.rank-top .rank-badge { background: var(--amber); color: #0d1220; }
    .rank-name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-stat { color: var(--text-2); font-size: 12px; white-space: nowrap; }
    .rank-points { color: var(--amber); font-weight: 700; white-space: nowrap; }
    .table-wrap { overflow-x: auto; margin-top: 14px; }
    .hist-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .hist-table th, .hist-table td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .hist-table th { color: var(--text-2); font-weight: 600; font-size: 12px; }
    .hist-table tr:hover td { background: rgba(255,255,255,.02); }
    .form-grid .full { grid-column: 1 / -1; }
    .field label { display: block; font-size: 12px; color: var(--text-3); margin-bottom: 6px; letter-spacing: 0.08em; }
    .range-row { display: flex; align-items: center; gap: 10px; }
    .range-row input[type="range"] { flex: 1; accent-color: var(--amber); }
    .range-val { font-size: 12.5px; color: var(--amber); font-weight: 700; min-width: 26px; text-align: right; font-variant-numeric: tabular-nums; }
    .cfg-list, .player-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .cfg-card, .player-card-row {
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .cfg-card.selected { border-color: rgba(232, 180, 90, 0.55); box-shadow: 0 0 0 3px var(--amber-dim); }
    .cfg-card .row1 { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .cfg-card .cname { font-weight: 700; font-size: 14.5px; }
    .cfg-card .curl { font-size: 12px; color: var(--text-3); margin-top: 3px; font-family: var(--font-mono); word-break: break-all; }
    .cfg-card .cmodels { margin-top: 10px; font-size: 12px; color: var(--text-2); }
    .cfg-card .cmodels b { color: var(--green); font-weight: 600; }
    .cfg-actions, .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .player-card-row .prow { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
    .player-card-row .pname { font-weight: 700; font-size: 14.5px; }
    .player-card-row .pmeta { font-size: 12px; color: var(--text-3); margin-top: 3px; font-family: var(--font-mono); }
    .edit-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line-strong); }
    .edit-box .form-grid { margin-top: 12px; }
    .config-hint { margin-top: 18px; padding: 13px 16px; background: var(--surface-2); border: 1px dashed var(--line-strong);
      border-radius: 11px; font-size: 12.5px; color: var(--text-3); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .config-hint a { text-decoration: none; }

    /* ---------- 弹窗 ---------- */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(5, 8, 16, 0.68);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; transition: opacity 0.22s var(--ease-out);
    }
    .modal-overlay.open { opacity: 1; }
    .modal-card {
      width: 100%; max-width: 400px; max-height: min(84vh, 640px); overflow-y: auto;
      background: linear-gradient(180deg, #1b2540, #121a2d);
      border: 1px solid var(--line-strong); border-radius: 16px; box-shadow: var(--shadow-lg);
      padding: 22px; transform: scale(0.92) translateY(12px); transition: transform 0.25s var(--ease-spring);
    }
    .modal-overlay.open .modal-card { transform: none; }
    .modal-title { font-size: 17px; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 6px; }
    .modal-message { font-size: 13.5px; color: var(--text-2); line-height: 1.65; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-pre {
      background: #0c1322; border: 1px solid var(--line); border-radius: 10px;
      padding: 12px; font-size: 12px; font-family: var(--font-mono); color: var(--cyan);
      max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin-top: 8px;
    }

    /* ---------- Toast ---------- */
    #toast-container { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 1100;
      display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: min(92vw, 420px); }
    .toast {
      padding: 11px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600;
      background: var(--surface-2); color: var(--text-1); border: 1px solid var(--line-strong);
      box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 9px;
      opacity: 0; transform: translateY(-10px) scale(0.96);
      transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
      max-width: 100%;
    }
    .toast.show { opacity: 1; transform: none; }
    .toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex-shrink: 0; }
    .toast--error::before { background: var(--red); }
    .toast--success::before { background: var(--green); }
    .toast--info::before { background: var(--amber); }

    /* ---------- 规则选项行（首页创建对局） ---------- */
    .options-row {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px;
    }
    .opt-group { min-width: 0; }
    .opt-label {
      display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3);
      letter-spacing: 0.12em; font-weight: 600; margin-bottom: 7px;
    }
    .opt-seg { display: flex; background: #0e1526; border: 1px solid var(--line-strong); border-radius: 9px; padding: 3px; gap: 3px; }
    .opt-seg button {
      flex: 1; border: 0; background: transparent; color: var(--text-2); font-family: inherit;
      font-size: 12.5px; font-weight: 600; padding: 7px 4px; border-radius: 7px; cursor: pointer;
      transition: all 0.18s var(--ease-out); white-space: nowrap; touch-action: manipulation;
    }
    .opt-seg button:hover { color: var(--text-1); }
    .opt-seg button.active { background: linear-gradient(135deg, var(--amber-2), var(--amber) 60%, #d99a3d); color: #241503; }
    .opt-hint { font-size: 11px; color: var(--text-3); margin-top: 6px; line-height: 1.5; }

    /* ---------- 求和横幅 ---------- */
    .draw-banner {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 14px; padding: 12px 16px; border-radius: 12px;
      background: rgba(111, 211, 255, 0.09); border: 1px solid rgba(111, 211, 255, 0.32);
      font-size: 13.5px; color: var(--cyan);
    }
    .draw-banner .db-text { flex: 1; min-width: 160px; }
    .draw-banner .db-actions { display: flex; gap: 8px; }

    /* ---------- 复盘页 ---------- */
    .replay-layout {
      max-width: 1160px; margin: 0 auto; padding: clamp(14px, 3vw, 26px) clamp(12px, 3vw, 30px) 56px;
      display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: clamp(16px, 2.5vw, 26px);
      align-items: start;
    }
    .replay-controls {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 16px;
    }
    .step-slider { flex: 1; min-width: 180px; accent-color: var(--amber); }
    .step-info { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .move-list { max-height: 300px; overflow-y: auto; padding: 8px 10px; scrollbar-width: thin; }
    .move-list::-webkit-scrollbar { width: 6px; }
    .move-list::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }
    .move-row {
      display: grid; grid-template-columns: 34px 22px 1fr auto; gap: 8px; align-items: center;
      padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
      transition: background 0.15s;
    }
    .move-row:hover { background: rgba(255, 255, 255, 0.04); }
    .move-row.current { background: rgba(232, 180, 90, 0.14); box-shadow: inset 0 0 0 1px rgba(232, 180, 90, 0.35); }
    .move-no { color: var(--text-3); font-variant-numeric: tabular-nums; }
    .move-coord { font-family: var(--font-mono); color: var(--text-2); }
    .tag {
      font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; letter-spacing: 0.04em; white-space: nowrap;
    }
    .tag-best { background: rgba(61, 220, 151, 0.15); color: var(--green); }
    .tag-good { background: rgba(111, 211, 255, 0.13); color: var(--cyan); }
    .tag-inaccuracy { background: rgba(232, 180, 90, 0.16); color: var(--amber); }
    .tag-mistake { background: rgba(255, 155, 90, 0.16); color: #ff9b5a; }
    .tag-blunder { background: rgba(255, 107, 107, 0.16); color: var(--red); }

    .curve-wrap { padding: 12px 14px 6px; }
    .curve-legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-3); margin-top: 8px; flex-wrap: wrap; }
    .curve-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }

    .review-card { padding: 14px 16px; }
    .review-summary { font-size: 13.5px; line-height: 1.7; color: var(--text-1); }
    .review-turn { font-size: 12.5px; color: var(--amber); margin-top: 8px; line-height: 1.6; }
    .km-item { padding: 10px 0; border-top: 1px dashed rgba(148, 163, 184, 0.16); }
    .km-item:first-child { border-top: 0; }
    .km-head { font-size: 12px; color: var(--amber); font-weight: 700; margin-bottom: 4px; }
    .km-text { font-size: 12.5px; color: var(--text-2); line-height: 1.65; }
    .km-better { font-size: 12.5px; color: var(--green); line-height: 1.65; margin-top: 3px; }
    .advice-list { margin: 8px 0 0 16px; }
    .advice-list li { font-size: 12.5px; color: var(--text-2); line-height: 1.7; margin-bottom: 4px; }

    /* ---------- 擂台赛 ---------- */
    .arena-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
    .run-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .run-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .run-vs { font-weight: 700; font-size: 14.5px; }
    .run-score { display: flex; gap: 18px; margin-top: 10px; font-size: 13px; flex-wrap: wrap; }
    .run-score b { font-size: 18px; font-variant-numeric: tabular-nums; }
    .progress-track { height: 6px; background: #0e1526; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--amber-2), var(--amber)); border-radius: 3px; transition: width 0.4s var(--ease-out); }
    .run-meta { font-size: 11.5px; color: var(--text-3); margin-top: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
    .h2h-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface-2); border-radius: 8px; font-size: 12.5px; }
    .h2h-score { color: var(--amber); font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ---------- 系统状态 ---------- */
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 1px; background: var(--line); margin-top: 14px; }
    .metric-item { background: var(--surface-2); padding: 12px 14px; text-align: center; }
    .metric-value { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .metric-label { font-size: 11px; color: var(--text-3); margin-top: 3px; letter-spacing: 0.06em; }
    .bar-track { height: 5px; background: #0e1526; border-radius: 3px; overflow: hidden; margin-top: 7px; }
    .bar-fill { height: 100%; border-radius: 3px; }
    .bar-ok { background: var(--green); }
    .bar-warn { background: var(--amber); }
    .bar-bad { background: var(--red); }

    /* ---------- 响应式 ---------- */
    @media (max-width: 1023px) {
      .game-layout { grid-template-columns: 1fr; }
      .replay-layout { grid-template-columns: 1fr; }
      .side-panel { position: static; }
      .log-list { max-height: 220px; }
      .options-row { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .options-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .seat-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .playerbar { grid-template-columns: 1fr; gap: 8px; }
      .turn-badge { order: -1; flex-direction: row; justify-content: center; padding: 4px 0 2px; }
      .brand-sub { display: none; }
      .room-card { flex-direction: column; align-items: stretch; }
      .room-actions { justify-content: flex-start; }
      .modal-actions { flex-direction: column-reverse; }
      .modal-actions .btn { width: 100%; }
    }

    /* ---------- 无障碍：减少动效 ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-container" aria-live="polite"></div>

  <script>
    const API = '/api';
    const MODES = { pve: '人机对弈', pvp: '真人对战', watch: 'AI 观战' };
    let state = {
      configs: [],
      players: [],
      rooms: [],
      game: null,
      currentRoom: null,
      logs: [],
      mode: 'pve',
      black: 0,
      white: 0,
      selectedConfigId: null,
      humanRoles: { black: false, white: false }, // 哪几方是"玩家自己"（pvp 时两个都 true）
      editingPlayerId: null, // 正在编辑的 AI 玩家 id
      _moving: false,
      _boardKey: '', // 上一帧棋盘 JSON，用于识别"新落子"以触发动画
      _viewingResult: false, // 终局后点击"查看棋局"进入只读回顾
      history: null, // 历史页数据 {games, ranking}
      // 房间规则选项（首页创建表单的默认值，新建对局时生效）
      options: { size: 15, forbidden: 0, difficulty: 'normal', first: 1 },
      gameOptions: null,    // 当前对局已固化的规则（只读展示，不回写创建表单）
      // 擂台赛
      arena: null,      // {runs, running_id}
      arenaForm: { a: 0, b: 0, rounds: 4, size: 15, forbidden: 0, difficulty: 'normal', max_moves: 80 },
      _arenaTimer: null,
      // 系统状态
      stats: null,
      // 复盘
      replay: null,     // {game, analysis, step, playing, review}
    };

    // 当前执子的角色名（'black' / 'white'）
    function roleOfTurn(turn) { return turn === 1 ? 'black' : 'white'; }
    // 该角色是否是"玩家自己"
    function isHumanRole(role) { return !!(state.humanRoles && state.humanRoles[role]); }
    // 当前回合是否是人类回合
    function isHumanTurnNow() {
      if (!state.game) return false;
      return isHumanRole(roleOfTurn(state.game.turn));
    }

    // 可选 API Key 认证：后端设置 AUTH_TOKEN 后，前端需带上同一 token。
    // 配置方式二选一：1) 浏览器 localStorage 设置 gomoku_token；2) 页面加载前定义 window.AUTH_TOKEN。
    function authHeaders() {
      const token = window.AUTH_TOKEN || localStorage.getItem('gomoku_token');
      return token ? { 'X-Api-Key': token } : {};
    }

    async function api(path, opts = {}) {
      const res = await fetch(API + path, {
        headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(opts.headers || {}) },
        ...opts,
      });
      if (!res.ok) {
        // 优先提取 JSON 错误消息（detail 字段），HTML/其他内容截断前 200 字符
        let msg = '';
        try {
          const data = await res.json();
          msg = data.detail || data.message || JSON.stringify(data);
        } catch (_) {
          const text = await res.text().catch(() => '');
          msg = text ? text.slice(0, 200) : `HTTP ${res.status}`;
        }
        throw new Error(msg || `HTTP ${res.status}`);
      }
      return res.json();
    }

    /* ================= 安全：HTML 转义 ================= */
    // 所有用户/LLM 提供的文本在拼进 innerHTML 前必须先转义，
    // 防止存储型 XSS（玩家名/配置名/base_url，以及 LLM 返回的 reason 经日志渲染）。
    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* ================= 轻提示 / 弹窗 ================= */
    function toast(msg, type = 'info') {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast toast--${type}`;
      el.textContent = msg;
      box.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }, 2600);
    }

    // 通用弹窗：resolve(结果对象) 或 resolve(null)（取消）
    function showModal({ title, message, bodyHTML, confirmText = '确定', cancelText = '取消', danger = false }) {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        // title / message 是用户可控文本，先转义再拼 HTML；bodyHTML 由调用方保证已转义
        overlay.innerHTML = `
          <div class="modal-card">
            <div class="modal-title">${escapeHtml(title)}</div>
            ${message ? `<div class="modal-message">${escapeHtml(message)}</div>` : ''}
            ${bodyHTML ? `<div class="modal-body">${bodyHTML}</div>` : ''}
            <div class="modal-actions">
              ${cancelText ? `<button class="btn btn-ghost" data-act="cancel">${escapeHtml(cancelText)}</button>` : ''}
              <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="ok">${escapeHtml(confirmText)}</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('open')));
        function close(val) {
          overlay.classList.remove('open');
          setTimeout(() => overlay.remove(), 240);
          resolve(val);
        }
        overlay.addEventListener('click', e => { if (e.target === overlay) close(null); });
        const cancelBtn = overlay.querySelector('[data-act=cancel]');
        if (cancelBtn) cancelBtn.addEventListener('click', () => close(null));
        overlay.querySelector('[data-act=ok]').addEventListener('click', () => {
          const result = {};
          overlay.querySelectorAll('[data-field]').forEach(el => { result[el.dataset.field] = el.value; });
          close(result);
        });
        // 回车确认
        overlay.querySelectorAll('input').forEach(inp => inp.addEventListener('keydown', e => {
          if (e.key === 'Enter') overlay.querySelector('[data-act=ok]').click();
        }));
        const first = overlay.querySelector('input, select');
        if (first) setTimeout(() => first.focus(), 60);
      });
    }

    // 字段表单弹窗：fields = [{id,label,type,placeholder,value,options}]
    function promptFields({ title, fields }) {
      // 所有动态值转义后再插入 HTML 属性/文本，防 DOM-based XSS
      const esc = escapeHtml;
      const body = fields.map(f => {
        let control;
        if (f.type === 'range') {
          control = `
            <div class="range-row">
              <input data-field="${esc(f.id)}" type="range" min="0" max="100" value="${esc(f.value ?? 50)}"
                     oninput="this.nextElementSibling.textContent=this.value" />
              <span class="range-val">${esc(f.value ?? 50)}</span>
            </div>`;
        } else if (f.options && f.options.length) {
          // options 支持字符串或 {value, label} 对象
          control = `<select data-field="${esc(f.id)}">${f.options.map(o =>
            typeof o === 'object' ? `<option value="${esc(o.value)}">${esc(o.label)}</option>` : `<option value="${esc(o)}">${esc(o)}</option>`
          ).join('')}</select>`;
        } else {
          control = `<input data-field="${esc(f.id)}" type="${esc(f.type || 'text')}" placeholder="${esc(f.placeholder || '')}" value="${esc(f.value || '')}" />`;
        }
        return `<div class="field"><label>${esc(f.label)}</label>${control}</div>`;
      }).join('');
      return showModal({ title, bodyHTML: `<div class="form-grid" style="grid-template-columns:1fr">${body}</div>` });

    async function createRoom() {

      } else {

        if (state.black === '0' || state.white === '0') return toast('请先为黑白双方选择玩家', 'error');
        const isHumanBlack = state.black === 'human';
        const isHumanWhite = state.white === 'human';
        const humanCount = (isHumanBlack ? 1 : 0) + (isHumanWhite ? 1 : 0);
        if (state.mode === 'pve' && humanCount !== 1) {
          return toast('人机模式：必须选择一位「玩家自己」+ 一位 AI', 'error');

      const seats = [
        { player_id: state.black === 'human' ? null : Number(state.black), role: 'black' },
        { player_id: state.white === 'human' ? null : Number(state.white), role: 'white' },
      ];

    /* ================= 音效 ================= */
    let _audioCtx = null;
    let _lastSound = { stones: -1, role: 0 };

    // 落子音效：用 WebAudio 合成短促"嗒"声，黑子低音、白子高音，无需外部音频文件
    function playStoneSound(role, stones) {
      try {
        if (stones !== undefined && _lastSound.stones === stones) return; // 同一手不重复
        _lastSound = { stones, role };
        if (!_audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          _audioCtx = new AC();
        }
        if (_audioCtx.state === 'suspended') _audioCtx.resume();
        const ctx = _audioCtx;
        const t0 = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        // 黑子 150Hz 低音，白子 300Hz 高音
        osc.frequency.setValueAtTime(role === 1 ? 150 : 300, t0);
        gain.gain.setValueAtTime(0.6, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.2);
      } catch (e) {
        /* 音频不可用时静默忽略 */
      }
    }

    /* ================= 对局加载 / SSE ================= */
    async function loadGame(gameId) {
      if (state._es) {
        state._es.close();
        state._es = null;
      }
      if (state._hb) {
        clearInterval(state._hb);
        state._hb = null;
      }
      if (!gameId || isNaN(gameId)) {
        toast('无效的对局ID', 'error');
        location.href = '/';
        return;
      }
      try {
        if (state.players.length === 0) {
          state.players = await api('/players/');
        }
        if (state.rooms.length === 0) {
          state.rooms = await api('/rooms/');
        }
        const game = await api(`/games/${gameId}/state`);
        state.game = game;
        state.logs = game.logs || [];
        state._boardKey = ''; // 新对局：棋盘整体重置，不触发落子动画
        state.currentRoom = state.rooms.find(r => r.id === game.room_id);
        // 如果缓存里没找到该房间，刷新房间列表再试一次
        if (!state.currentRoom) {
          state.rooms = await api('/rooms/');
          state.currentRoom = state.rooms.find(r => r.id === game.room_id);
        }
        state.humanRoles = { black: false, white: false };
        const seats = (() => {
          const raw = state.currentRoom?.seats;
          if (Array.isArray(raw)) return raw;
          try { return JSON.parse(raw || '[]'); } catch { return []; }
        })();
        const isHumanSeat = s => s.player_id === null || s.player_id === 0 || s.player_id === 'human';
        for (const s of seats) {
          if (s.role === 'black') state.humanRoles.black = isHumanSeat(s);
          if (s.role === 'white') state.humanRoles.white = isHumanSeat(s);
        }
        // 兜底：房间信息缺失时从落子记录推断（人类落子的 player_name 为 "Player"）
        if (!state.humanRoles.black && !state.humanRoles.white && state.currentRoom?.mode !== 'watch') {
          const firstMove = game.history?.[0];
          const secondMove = game.history?.[1];
          const hit = firstMove?.player_name === 'Player' ? firstMove
                    : (secondMove?.player_name === 'Player' ? secondMove : null);
          if (hit) state.humanRoles[hit.player === 1 ? 'black' : 'white'] = true;
        }
        state.mode = state.currentRoom ? state.currentRoom.mode : 'pve';
        // 规则选项：只记录到 gameOptions 供对局页展示，不覆盖 state.options
        // （state.options 是首页创建表单的默认值，被历史对局改写会让用户困惑）
        if (game.size) {
          state.gameOptions = {
            size: game.size,
            forbidden: game.forbidden ? 1 : 0,
            difficulty: game.difficulty || 'normal',
            first: game.first || 1,
          };
        }
        // 确保数据就绪后立即渲染一次
        render();
      } catch (e) {
        toast('加载对局失败: ' + e.message, 'error');
        location.href = '/';
        return;
      }
      connectSSE(gameId, 0);
    }

    function connectSSE(gameId, attempt) {
      // 清理旧连接
      if (state._es) {
        try { state._es.close(); } catch (_) {}
        state._es = null;
      }
      if (state._hb) { clearInterval(state._hb); state._hb = null; }
      let lastPushTime = Date.now();
      let pushSeq = 0;
      const MAX_SSE_RETRIES = 10;
      const es = new EventSource(`/api/games/${gameId}/stream`);
      state._es = es;
      state._es.gameId = gameId;
      console.log(`[SSE] connecting attempt=${attempt}`);
      // 重连成功后清空重试计数，并全量拉取最新状态
      es.onopen = async () => {
        console.log('[SSE] open');
        attempt = 0;  // 连上后清零重试计数
        // 重连成功后全量拉取一次最新状态：防止断连期间 AI 已落子但前端没收到
        // game_update，导致 turn 停留在旧值、用户被"锁死"无法落子
        try {
          const fresh = await api(`/games/${gameId}/state`);
          if (fresh && fresh.board) {
            state.game = { ...state.game, ...fresh };
            render().catch(err => console.error('[render] error', err));
          }
        } catch (_) { /* 拉取失败等下次推送 */ }
      };
      es.addEventListener('game_update', e => {
        try {
          const data = JSON.parse(e.data);
          lastPushTime = Date.now();
          pushSeq++;
          const prevStoneCount = (state.game?.board || []).reduce((s, r) => s + r.filter(c => c !== 0).length, 0);
          state.game = { ...state.game, ...data };
          state._aiPending = !!data.ai_pending;
          const nextStoneCount = (state.game?.board || []).reduce((s, r) => s + r.filter(c => c !== 0).length, 0);
          if (data.logs) state.logs = data.logs;
          // 落子音效：石头数增加说明有新落子；根据更新后的 turn 推断刚才是谁落的
          if (nextStoneCount > prevStoneCount) {
            const lastMoveRole = data.turn === 1 ? 2 : 1; // 落子后 turn 切换，刚落的是另一方
            playStoneSound(lastMoveRole, nextStoneCount);
          }
          render().catch(err => console.error('[render] error', err));
        } catch (err) {
          console.error('[SSE] parse error', err, e.data);
        }
      });
      es.addEventListener('game_over', e => {
        console.log('[SSE] game_over', e.data);
        try {
          const data = JSON.parse(e.data);
          state.game.status = data.status;
          state.game.winner = data.winner;
          state._aiPending = false;
          lastPushTime = Date.now();
          pushSeq++;
          render().catch(err => console.error('[render] error', err));
        } catch (err) {
          console.error('[SSE] game_over parse error', err);
        }
        es.close();  // 已结束，不重连
      });
      es.onerror = (e) => {
        console.error('[SSE] onerror', e, 'readyState=', es.readyState);
        // 终局状态就不重连
        if (state.game && (state.game.status === 'finished' || state.game.status === 'draw')) return;
        // 用户已离开对局页则不再重连（避免离开后仍在后台反复建连）
        if (!location.hash.startsWith('#game')) {
          console.log('[SSE] 已离开对局页，停止重连');
          if (state._hb) { clearInterval(state._hb); state._hb = null; }
          return;
        }
        // 达到最大重试上限停止重连，防止服务宕机时无休止重试消耗资源
        if (attempt >= MAX_SSE_RETRIES) {
          console.warn(`[SSE] 已达到最大重连次数 (${MAX_SSE_RETRIES})，停止自动重连`);
          if (state._hb) { clearInterval(state._hb); state._hb = null; }
          return;
        }
        // 只要连接不是 OPEN 就主动重建（EventSource 可能卡在 CONNECTING 不触发重连回调）
        if (es.readyState !== EventSource.OPEN) {
          es.close();
          const delay = Math.min(1000 * Math.pow(1.6, attempt), 10000);
          attempt += 1;
          console.log(`[SSE] reconnecting in ${Math.round(delay)}ms (attempt ${attempt}/${MAX_SSE_RETRIES})`);
          setTimeout(() => connectSSE(gameId, attempt), delay);
        }
      };
      // 心跳兜底：SSE 静默失效（连接活着但不推送）时，4s 后主动拉 /state 同步，
      // 避免"AI 已落子但前端卡在旧 turn"的假卡死，最多延迟几秒自愈
      state._hb = setInterval(async () => {
        if (!state.game || state.game.status === 'finished' || state.game.status === 'draw') return;
        if (Date.now() - lastPushTime > 4000) {
          console.log('[SSE] heartbeat: no push for 4s, syncing state...');
          // 存储 fetch 前的 pushSeq，防止 fetch 期间 SSE 推送新数据导致覆盖
          const beforeSeq = pushSeq;
          const beforeMoves = (state.game.history || []).length;
          try {
            const fresh = await api(`/games/${gameId}/state`);
            // 双重保护：1) fetch 期间无新 SSE 推送（pushSeq 单调一致）；2) 服务端手数不落后于本地手数，
            // 避免用旧状态覆盖新状态（极端时序下 SSE 先推新、fetch 返回旧快照）
            if (fresh && fresh.board && pushSeq === beforeSeq) {
              const serverMoves = (fresh.history || []).length;
              if (serverMoves >= beforeMoves) {
                state.game = { ...state.game, ...fresh };
                render().catch(err => console.error('[render] error', err));
              }
            }
          } catch (_) {}
        }
      }, 3000);
    }

    /* ================= 落子 ================= */
    async function makeMove(row, col) {
      if (state.mode === 'watch') return;
      if (!state.game || state.game.status !== 'playing') return;
      if (state._moving) return;
      if (!isHumanTurnNow()) return;
      state._moving = true;
      // 必须在任何 await 之前锁定"本手是谁下的"：
      // POST 期间 SSE 可能已把 turn 推进，事后读 turn 会把黑子渲染成白子。
      const myStone = state.game.turn;
      // 乐观更新前保存快照：API 失败时回滚棋盘与回合，保证前端与后端一致
      const snapshot = JSON.parse(JSON.stringify(state.game));
      try {
        const res = await api(`/games/${state.game.id}/move`, { method: 'POST', body: JSON.stringify({ row, col }) });
        // 乐观更新：立即在棋盘上放置棋子并切换回合，不用等 SSE
        const newBoard = state.game.board.map((r, ri) => r.map((c, ci) => (ri === row && ci === col ? myStone : c)));
        const stoneCount = newBoard.reduce((s, r) => s + r.filter(c => c !== 0).length, 0);
        state.game = { ...state.game, board: newBoard, turn: 3 - myStone };
        playStoneSound(myStone, stoneCount); // 人类落子音效
        render();
      } catch (e) {
        console.error('[makeMove] error', e);
        // 回滚到快照，移除乐观放置的棋子、恢复回合
        state.game = snapshot;
        toast('落子失败: ' + e.message, 'error');
        render();
      } finally {
        state._moving = false;
      }
    }

    /* ================= 棋盘渲染 ================= */
    // 找出获胜五连（返回坐标数组），用于高亮
    function findWinLine(board, player, size) {
      const n = size || board.length;
      const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (board[r][c] !== player) continue;
          for (const [dr, dc] of dirs) {
            const cells = [[r, c]];
            for (let k = 1; k < 5; k++) {
              const nr = r + dr * k, nc = c + dc * k;
              if (nr < 0 || nr >= n || nc < 0 || nc >= n || board[nr][nc] !== player) break;
              cells.push([nr, nc]);
            }
            if (cells.length === 5) return cells;
          }
        }
      }
      return null;
    }

    // 星位：15 路为 (3,3)(3,11)(11,3)(11,11)(7,7)；小棋盘按比例取中心与四分位
    function isStarCell(r, c, n) {
      const mid = (n - 1) / 2;
      if (Number.isInteger(mid) && r === mid && c === mid) return true;
      if (n < 11) return false;
      const a = n >= 15 ? 3 : 2;
      const b = n - 1 - a;
      return (r === a || r === b) && (c === a || c === b);
    }

    function renderBoard(board, options = {}) {
      const size = options.size || state.game?.size || 15;
      const boardData = board || state.game?.board || Array.from({ length: size }, () => Array(size).fill(0));
      const playing = options.playing ?? (state.game?.status === 'playing');
      const isAiTurn = playing && !isHumanRole(roleOfTurn(state.game?.turn ?? 1)) && isHumanRole('black') !== isHumanRole('white');
      const humanTurn = playing && isHumanTurnNow();
      const lastMove = options.lastMove !== undefined
        ? options.lastMove
        : (state.game?.history?.length ? state.game.history[state.game.history.length - 1] : null);
      const winCells = (options.winner && options.replay !== true)
        ? findWinLine(boardData, options.winner, size)
        : (options.winCells || null);

      // 新落子识别：与上一帧棋盘比对
      const boardKey = JSON.stringify(boardData);
      let prevBoard = null;
      if (state._boardKey && state._boardKey !== boardKey) {
        try { prevBoard = JSON.parse(state._boardKey); } catch (_) {}
      }
      state._boardKey = boardKey;

      const turnClass = humanTurn ? (state.game.turn === 2 ? 'turn-2' : 'turn-1') : 'no-ghost';
      const aiTurnClass = isAiTurn ? ' ai-turn' : '';

      let html = `<div class="board-grid ${turnClass}${aiTurnClass}" style="grid-template-columns:repeat(${size},1fr);background-size:calc(100% / ${size}) 100%, 100% calc(100% / ${size}), auto, auto">`;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = boardData[r][c];
          const stone = cell === 1 ? 'black' : cell === 2 ? 'white' : '';
          const isLast = lastMove && lastMove.row === r && lastMove.col === c;
          const isWin = winCells && winCells.some(([wr, wc]) => wr === r && wc === c);
          const isNew = prevBoard && prevBoard[r] && prevBoard[r][c] === 0 && cell !== 0;
          const star = isStarCell(r, c, size) ? ' star' : '';
          const stoneHTML = stone
            ? `<div class="stone stone--${stone}${isLast ? ' stone--last' : ''}${isWin ? ' stone--win' : ''}${isNew ? ' stone--new' : ''}"></div>`
            : '';
          html += `<div class="board-cell${star}${stone ? ' has-stone' : ''}" onclick="makeMove(${r},${c})">${stoneHTML}</div>`;
        }
      }
      html += '</div>';
      return html;
    }

    /* ================= 首页渲染 ================= */
    function renderHome() {
      const blackIsHuman = state.black === 'human';
      const whiteIsHuman = state.white === 'human';
      const isPvp = state.mode === 'pvp';
      const isWatch = state.mode === 'watch';
      // 人机模式：一方已选"玩家自己"，另一方就禁用该选项（保证恰好一个人类）
      // 真人对战：双方锁定"玩家自己"，AI 选项禁用
      // 观战模式：禁用"玩家自己"
      const blackHumanDisabled = isWatch || (state.mode === 'pve' && whiteIsHuman);
      const whiteHumanDisabled = isWatch || (state.mode === 'pve' && blackIsHuman);
      const aiDisabled = isPvp;
      const roomList = state.rooms.length === 0
        ? `<div class="empty"><span class="empty-emoji">🀄</span>暂无对局，创建一局开始对弈吧</div>`
        : state.rooms.map(r => {
            const isWaiting = r.status === 'waiting';
            const isPlaying = !isWaiting && r.game_status === 'playing';
            const statusBadge = isWaiting
              ? '<span class="badge badge-waiting">等待开始</span>'
              : (isPlaying ? '<span class="badge badge-playing">对局中</span>' : '<span class="badge badge-finished">已结束</span>');
            const modeBadge = `<span class="badge badge-mode">${MODES[r.mode] || r.mode}</span>`;
            const opts = r.options || {};
            const optText = [
              `${opts.size || 15} 路`,
              opts.forbidden ? '禁手' : '自由',
              ({ easy: '简单', normal: '普通', hard: '困难' })[opts.difficulty] || '普通',
              (opts.first === 2 ? '白先' : '黑先'),
            ].join(' · ') + (opts.swap ? ' · 三手交换' : '');
            const canStart = isWaiting || !isPlaying;
            return `
              <div class="room-card">
                <div class="room-info">
                  <div class="room-title">
                    <span>房间 #${r.id}</span>${statusBadge}${modeBadge}
                  </div>
                  <div class="room-meta">
                    <span>黑方：${getSeatNameFromRoom(r, 'black')}</span>
                    <span>白方：${getSeatNameFromRoom(r, 'white')}</span>
                    <span>${optText}</span>
                    ${r.game_id ? `<span>对局 #${r.game_id}</span>` : ''}
                  </div>
                </div>
                <div class="room-actions">
                  ${canStart
                    ? `<button class="btn btn-primary btn-sm" onclick="startRoom(${r.id})">${isWaiting ? '开始对局' : '再来一局'}</button>`
                    : `<button class="btn btn-primary btn-sm" onclick="enterRoom(${r.id}, ${r.game_id ?? null})">进入观战</button>`}
                  ${!isWaiting && r.game_id ? `<button class="btn btn-ghost btn-sm" onclick="viewRoomGame(${r.id})">查看棋局</button>` : ''}
                  ${!isWaiting && r.game_id ? `<button class="btn btn-ghost btn-sm" onclick="gotoReplay(${r.game_id})">复盘</button>` : ''}
                  <button class="btn btn-ghost btn-sm" onclick="deleteRoom(${r.id})">删除</button>
                </div>
              </div>`;
          }).join('');

      return `
        <div class="home-wrap">
          <div class="hero">
            <h1 class="hero-title">弈境 · AI 五子棋</h1>
            <p class="hero-sub">深邃棋盘之上 · 与 AI 共弈一场五子之局</p>
            <div class="hero-chips">
              <span class="chip chip-black"></span>
              <span class="chip chip-white"></span>
            </div>
          </div>

          <div class="card create-card">
            <div class="card-head">
              <h2>创建对局</h2>
              <span class="hint">先到<a href="#config" style="color:var(--amber);text-decoration:none;font-weight:700">配置管理</a>添加 AI 玩家</span>
            </div>
            <div class="create-body">
              <div class="seg" role="tablist" aria-label="对局模式">
                <button class="seg-item ${state.mode === 'pve' ? 'active' : ''}" role="tab" aria-selected="${state.mode === 'pve'}" onclick="state.mode='pve';switchMode()">⚔️ 人机对弈</button>
                <button class="seg-item ${state.mode === 'pvp' ? 'active' : ''}" role="tab" aria-selected="${state.mode === 'pvp'}" onclick="state.mode='pvp';switchMode()">👥 真人对战</button>
                <button class="seg-item ${state.mode === 'watch' ? 'active' : ''}" role="tab" aria-selected="${state.mode === 'watch'}" onclick="state.mode='watch';switchMode()">👀 AI 观战</button>
              </div>
              <div class="seat-grid">
                <div class="seat">
                  <div class="seat-label"><span class="chip chip-black"></span>黑方</div>
                  <select onchange="state.black=this.value;render()" aria-label="黑方玩家">
                    <option value="">选择玩家</option>
                    <option value="human" ${blackIsHuman || isPvp ? 'selected' : ''} ${blackHumanDisabled ? 'disabled' : ''}>玩家自己</option>
                    ${state.players.map(p => `<option value="${p.id}" ${Number(state.black) === p.id ? 'selected' : ''} ${aiDisabled ? 'disabled' : ''}>${escapeHtml(p.name)}</option>`).join('')}
                  </select>
                </div>
                <div class="seat">
                  <div class="seat-label"><span class="chip chip-white"></span>白方</div>
                  <select onchange="state.white=this.value;render()" aria-label="白方玩家">
                    <option value="">选择玩家</option>
                    <option value="human" ${whiteIsHuman || isPvp ? 'selected' : ''} ${whiteHumanDisabled ? 'disabled' : ''}>玩家自己</option>
                    ${state.players.map(p => `<option value="${p.id}" ${Number(state.white) === p.id ? 'selected' : ''} ${aiDisabled ? 'disabled' : ''}>${escapeHtml(p.name)}</option>`).join('')}
                  </select>
                </div>
              </div>
              ${optionsRowHTML()}
              <div class="create-actions">
                <button class="btn btn-primary" onclick="createRoom()">创建对局</button>
              </div>
              <div class="create-hint">
                ${state.mode === 'pve' ? '人机模式：选择一位「玩家自己」+ 一位 AI 玩家，点击棋盘落子'
                  : state.mode === 'pvp' ? '真人对战：两位玩家在同一台设备轮流落子，无需 AI'
                  : '观战模式：双方均为 AI，你来当裁判欣赏对局'}
              </div>
            </div>
          </div>

          <div class="rooms-section">
            <h2>对局列表</h2>
            <div class="room-list">${roomList}</div>
          </div>
        </div>`;
    }

    // 从房间座位解析某一方名称（首页房间卡用）
    function getSeatNameFromRoom(room, role) {
      if (!room) return '—';
      const seats = Array.isArray(room.seats) ? room.seats
        : (() => { try { return JSON.parse(room.seats || '[]'); } catch { return []; } })();
      const seat = seats.find(s => s.role === role);
      if (seat && (seat.player_id === null || seat.player_id === 0 || seat.player_id === 'human')) return '玩家';
      if (seat && seat.player_id) {
        const p = state.players.find(x => x.id === Number(seat.player_id));
        if (p && p.name) return escapeHtml(p.name);
      }
      return 'AI';
    }

    // 获取某一方的展示名称：优先用房间座位配置的 AI 玩家名（state.players），
    // 人类座位显示 "Player"，查不到时兜底 "AI"。
    function getSeatName(role) {
      if (isHumanRole(role)) return 'Player';
      const raw = state.currentRoom?.seats;
      const seats = Array.isArray(raw)
        ? raw
        : (() => { try { return JSON.parse(raw || '[]'); } catch { return []; } })();
      const seat = seats.find(s => s.role === role);
      if (seat && seat.player_id) {
        const p = state.players.find(x => x.id === Number(seat.player_id));
        if (p && p.name) return escapeHtml(p.name);
      }
      return 'AI';
    }

    /* ================= 对局页渲染 ================= */
    function renderGame() {
      const g = state.game || {};
      const size = g.size || 15;
      const endedReason = g.ended_reason || '';
      const blackName = getSeatName('black');
      const whiteName = getSeatName('white');
      const playing = g.status === 'playing';
      const finished = g.status === 'finished';
      const draw = g.status === 'draw';
      const isPvp = state.mode === 'pvp';
      const isWatch = state.mode === 'watch';
      const isAiTurn = playing && !isHumanTurnNow();
      const humanTurn = playing && isHumanTurnNow();
      const aiThinking = playing && isAiTurn && state._aiPending;
      const stoneCount = (g.board || []).reduce((s, r) => s + r.filter(c => c !== 0).length, 0);
      const firstRole = (g.first || 1) === 1 ? 'black' : 'white';

      let winnerText, winnerIcon;
      if (draw) {
        winnerText = endedReason === 'agreement' ? '双方同意和棋' : (endedReason === 'cap' ? '达到手数上限 · 和棋' : '平局');
        winnerIcon = '🤝';
      } else if (finished) {
        const isResign = endedReason === 'resign';
        winnerText = (g.winner === 1 ? '黑方获胜' : '白方获胜') + (isResign ? '（对手认输）' : '');
        winnerIcon = g.winner === 1 ? '⚫' : '⚪';
      } else {
        winnerText = ''; winnerIcon = '';
      }

      // 回合徽标文案：真人对战强调"轮到谁"，人机强调"你的回合/AI 思考中"
      let badgeText = '';
      let badgeDot = false;
      if (finished) { badgeText = '对局结束'; badgeDot = false; }
      else if (draw) { badgeText = '平局'; badgeDot = false; }
      else if (isPvp) { badgeText = `轮到${g.turn === 1 ? '黑方' : '白方'} · 请落子`; badgeDot = true; }
      else if (humanTurn) { badgeText = '你的回合 · 请落子'; badgeDot = true; }
      else if (isAiTurn && aiThinking) { badgeText = 'AI 思考中…'; badgeDot = true; }
      else if (isAiTurn) { badgeText = isWatch ? 'AI 对弈中' : 'AI 计算中…'; badgeDot = true; }
      else if (isWatch) { badgeText = 'AI 对弈中'; badgeDot = true; }
      else { badgeText = '对局进行中'; badgeDot = true; }

      // 玩家卡激活态：当前回合方高亮；终局查看时获胜方高亮；AI 思考时显示 spinner
      const blackActive = (playing && g.turn === 1) || ((finished || draw) && g.winner === 1);
      const whiteActive = (playing && g.turn === 2) || ((finished || draw) && g.winner === 2);
      const blackThinking = playing && blackActive && aiThinking;
      const whiteThinking = playing && whiteActive && aiThinking;

      const statusText = finished ? (g.winner === 1 ? '黑方胜' : '白方胜') : draw ? '平局' : '进行中';
      const turnText = finished ? '已结束' : draw ? '平局' : (g.turn === 1 ? '黑方' : '白方');
      const modeText = MODES[state.mode] || state.mode || '人机对弈';
      const forbiddenText = g.forbidden ? '专业禁手' : '自由规则';
      const difficultyText = ({ easy: '简单', normal: '普通', hard: '困难' })[g.difficulty] || '普通';
      const pName = (n) => (n === 'Player' ? (isPvp ? '玩家' : '玩家（你）') : n);

      // ---- 三手交换横幅（第 3 手后由白方决定） ----
      let swapBanner = '';
      if (playing && g.pending_swap) {
        if (isHumanRole('white')) {
          swapBanner = `
            <div class="draw-banner">
              <span class="db-text">三手交换：黑方已下第 3 手，你（白方）可以选择接过黑棋</span>
              <span class="db-actions">
                <button class="btn btn-primary btn-sm" onclick="resolveSwap(true)">交换棋子</button>
                <button class="btn btn-ghost btn-sm" onclick="resolveSwap(false)">保持白方</button>
              </span>
            </div>`;
        } else {
          swapBanner = `
            <div class="draw-banner"><span class="db-text">三手交换：等待白方决定…</span></div>`;
        }
      }

      // ---- 求和横幅（真人对战） ----
      let drawBanner = '';
      if (playing && g.pending_draw && !g.pending_swap) {
        const offerRole = g.pending_draw === 1 ? '黑方' : '白方';
        const myRole = g.pending_draw === 1 ? 'white' : 'black';
        drawBanner = `
          <div class="draw-banner">
            <span class="db-text">${offerRole}提出求和${isPvp ? `，等待${myRole === 'black' ? '黑方' : '白方'}回应` : ''}</span>
            <span class="db-actions">
              ${isPvp ? `
                <button class="btn btn-primary btn-sm" onclick="respondDraw(${myRole === 'black' ? 1 : 2}, true)">接受</button>
                <button class="btn btn-ghost btn-sm" onclick="respondDraw(${myRole === 'black' ? 1 : 2}, false)">拒绝</button>
              ` : '<span style="color:var(--text-3);font-size:12px">等待处理…</span>'}
            </span>
          </div>`;
      }

      let resultOverlay = '';
      if ((finished || draw) && !state._viewingResult) {
        resultOverlay = `
          <div class="result-overlay">
            <div class="result-card">
              <div class="result-icon">${winnerIcon}</div>
              <div class="result-title">${winnerText || '对局结束'}</div>
              <div class="result-sub">本局共 ${stoneCount} 手 · ${modeText}</div>
              <div class="result-actions">
                <button class="btn btn-primary" onclick="restartGame()">再来一局</button>
                <button class="btn btn-ghost" onclick="openReplay()">复盘分析</button>
                <button class="btn btn-ghost" onclick="viewFinishedGame()">查看棋局</button>
                <button class="btn btn-ghost" onclick="goHome()">返回首页</button>
              </div>
            </div>
          </div>`;
      }

      // 真人对战没有 AI，思考日志面板没有意义
      const logsHTML = (state.logs || []).length === 0
        ? '<div class="log-empty">暂无日志 — AI 落子后将在这里展示思考过程</div>'
        : (state.logs || []).map(log => `<div class="log-entry">${escapeHtml(log)}</div>`).join('');

      // 渲染后滚动日志到底部
      setTimeout(() => {
        const lp = document.getElementById('log-list');
        if (lp) lp.scrollTop = lp.scrollHeight;
      }, 0);

      // 中途操作：观战模式没有"己方"，不显示悔棋/认输/求和
      const canUndo = !isWatch && stoneCount > 0;
      const undoCount = isPvp ? 1 : 2;
      const canAct = (playing && !isWatch);
      const myRole = isPvp ? (g.turn === 1 ? 'black' : 'white') : (state.humanRoles.black ? 'black' : 'white');
      const myPlayerNum = myRole === 'black' ? 1 : 2;

      return `
        <div class="game-layout">
          <section class="game-main">
            <div class="playerbar">
              <div class="player-card ${blackActive ? 'active' : ''}">
                <span class="chip chip-black"></span>
                <div style="min-width:0">
                  <div class="p-name">${pName(blackName)}</div>
                  <div class="p-role">黑方 · ${firstRole === 'black' ? '先手' : '后手'}</div>
                </div>
                <span class="p-status">${blackThinking ? '<span class="spinner"></span>' : (blackActive && !humanTurn ? '<span class="tb-dot" style="width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 1px rgba(232,180,90,.75)"></span>' : '')}</span>
              </div>
              <div class="turn-badge">
                ${badgeDot ? '<span class="tb-dot"></span>' : ''}
                <span>${badgeText}</span>
              </div>
              <div class="player-card ${whiteActive ? 'active' : ''}">
                <span class="chip chip-white"></span>
                <div style="min-width:0">
                  <div class="p-name">${pName(whiteName)}</div>
                  <div class="p-role">白方 · ${firstRole === 'white' ? '先手' : '后手'}</div>
                </div>
                <span class="p-status">${whiteThinking ? '<span class="spinner"></span>' : (whiteActive && !humanTurn ? '<span class="tb-dot" style="width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 1px rgba(232,180,90,.75)"></span>' : '')}</span>
              </div>
            </div>

            ${swapBanner}
            ${drawBanner}

            <div class="board-wrap">
              <div class="board-frame">
                ${renderBoard()}
              </div>
              ${resultOverlay}
            </div>

            <div class="game-controls">
              ${state._viewingResult
                ? `<button class="btn btn-ghost" onclick="closeViewFinished()">← 返回终局</button>`
                : `<button class="btn btn-primary" id="btn-restart" onclick="restartGame()">重新开始</button>`}
              ${canUndo ? `<button class="btn btn-ghost" onclick="undoMove(${undoCount})">悔棋${isPvp ? '' : '（退 2 手）'}</button>` : ''}
              ${canAct ? `<button class="btn btn-ghost" onclick="confirmResign(${myPlayerNum})">认输</button>` : ''}
              ${canAct && !g.pending_draw ? `<button class="btn btn-ghost" onclick="offerDraw(${myPlayerNum})">求和</button>` : ''}
              <button class="btn btn-ghost" onclick="openReplay()">复盘</button>
              <button class="btn btn-ghost" onclick="goHome()">返回首页</button>
            </div>
          </section>

          <aside class="side-panel">
            <div class="panel-card">
              <div class="panel-head">📊 对局信息</div>
              <div class="stat-grid">
                <div class="stat-item"><div class="stat-label">模式</div><div class="stat-value">${modeText}</div></div>
                <div class="stat-item"><div class="stat-label">状态</div><div class="stat-value">${statusText}</div></div>
                <div class="stat-item"><div class="stat-label">当前回合</div>
                  <div class="stat-value">
                    ${playing ? `<span class="dot ${g.turn === 1 ? 'dot-black' : 'dot-white'}"></span>${turnText}` : turnText}
                  </div>
                </div>
                <div class="stat-item"><div class="stat-label">已落子</div><div class="stat-value">${stoneCount} 手</div></div>
                <div class="stat-item"><div class="stat-label">棋盘 / 规则</div><div class="stat-value">${size} 路 · ${forbiddenText}</div></div>
                <div class="stat-item"><div class="stat-label">AI 难度</div><div class="stat-value">${difficultyText}</div></div>
              </div>
            </div>
            ${isPvp ? '' : `
            <div class="panel-card">
              <div class="panel-head">🧠 AI 思考日志</div>
              <div class="log-list" id="log-list">${logsHTML}</div>
            </div>`}
          </aside>
        </div>`;
    }

    /* ================= 中途操作：悔棋 / 认输 / 求和 ================= */
    async function undoMove(count) {
      if (!state.game) return;
      if ((state.game.history || []).length === 0) return toast('还没有落子，无法悔棋', 'error');
      const ok = await showModal({
        title: '悔棋',
        message: count >= 2
          ? '将回退 2 手（AI 的应手 + 你的那一手），确认吗？'
          : '将回退 1 手，确认吗？',
        confirmText: '确认悔棋',
      });
      if (!ok) return;
      try {
        const res = await api(`/games/${state.game.id}/undo`, { method: 'POST', body: JSON.stringify({ count }) });
        state.game = res.game;
        state.logs = res.game.logs || [];
        state._boardKey = '';
        toast('已悔棋', 'success');
        render();

        toast('悔棋失败: ' + e.message, 'error');

        confirmText: '确认认输',
        danger: true,
      });

      try {
        const res = await api(`/games/${state.game.id}/resign`, { method: 'POST', body: JSON.stringify({ player }) });

        state.logs = res.game.logs || [];
        toast('已认输', 'info');
        render();
      } catch (e) {
        toast('认输失败: ' + e.message, 'error');

    async function offerDraw(player) {
      try {
        const res = await api(`/games/${state.game.id}/draw/offer`, { method: 'POST', body: JSON.stringify({ player }) });
        if (res.resolved) {
          toast(res.accepted ? 'AI 接受了求和，本局和棋' : 'AI 拒绝了求和，对局继续', res.accepted ? 'success' : 'info');

        state.game = res.game;
        state.logs = res.game.logs || [];
        render();
      } catch (e) {
        toast('求和失败: ' + e.message, 'error');
      }

    async function resolveSwap(accept) {
      if (!state.game) return;
      try {
        const res = await api(`/games/${state.game.id}/swap`, { method: 'POST', body: JSON.stringify({ accept }) });
        state.game = res.game;
        state.logs = res.game.logs || [];
        // 交换后座位的执子方对调，humanRoles 需要按新座位重算
        if (Array.isArray(res.game.seats)) {
          const isHuman = s => s.player_id === null || s.player_id === 0 || s.player_id === 'human';
          for (const s of res.game.seats) {
            if (s.role === 'black') state.humanRoles.black = isHuman(s);
            if (s.role === 'white') state.humanRoles.white = isHuman(s);
          }
          if (state.currentRoom) state.currentRoom.seats = res.game.seats;
        }
        state._boardKey = '';
        toast(accept ? '已交换，你执黑继续' : '保持白方', 'success');
        render();
      } catch (e) {
        toast('操作失败: ' + e.message, 'error');
      }
    }

          method: 'POST', body: JSON.stringify({ player, accept }),

        state.game = res.game;
        state.logs = res.game.logs || [];
        toast(accept ? '已接受求和，本局和棋' : '已拒绝求和', accept ? 'success' : 'info');

    function openReplay() {

      location.href = `#replay/${state.game.id}`;
