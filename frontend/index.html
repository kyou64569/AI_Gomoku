    function gotoReplay(gameId) {
      if (!gameId) return toast('该房间暂无对局可复盘', 'error');
      location.href = `#replay/${gameId}`;
    }

    /* ==================== 对局复盘 ==================== */
    // 把前 step 手重放到棋盘上（复盘页的核心：board 永远由 history 前 N 手推导）
    function replayBoardAt(history, step, size) {
      const board = Array.from({ length: size }, () => Array(size).fill(0));
      for (let i = 0; i < step && i < history.length; i++) {
        const m = history[i];
        if (m && board[m.row] && board[m.row][m.col] === 0) board[m.row][m.col] = m.player;
      }
      return board;
    }

    async function loadReplay(gameId) {
      state.replay = null;
      try {
        const game = await api(`/games/${gameId}/state`);
        let analysis = { moves: [], players: {}, summary: {} };
        try {
          analysis = await api(`/games/${gameId}/analysis`);
        } catch (_) { /* 分析失败不阻塞复盘 */ }
        const total = (game.history || []).length;
        state.replay = {
          gameId,
          game,
          analysis,
          total,
          step: total,          // 默认停在终局
          review: null,
          reviewLoading: false,
          autoplay: null,
        };
        try {
          const r = await api(`/games/${gameId}/review`);
          if (r.status === 'ok' && r.review) state.replay.review = r.review;
        } catch (_) { /* 没有缓存点评时忽略 */ }
      } catch (e) {
        toast('复盘加载失败: ' + e.message, 'error');
        location.href = '/';
      }
    }

    function replayGo(step) {
      const rp = state.replay;
      if (!rp) return;
      rp.step = Math.max(0, Math.min(rp.total, step));
      render();
    }

    function replayStep(delta) {
      if (!state.replay) return;
      replayGo(state.replay.step + delta);
    }

    function replayToggleAuto() {
      const rp = state.replay;
      if (!rp) return;
      if (rp.autoplay) {
        clearInterval(rp.autoplay);
        rp.autoplay = null;
      } else {
        if (rp.step >= rp.total) rp.step = 0;
        rp.autoplay = setInterval(() => {
          const cur = state.replay;
          if (!cur) return;
          if (cur.step >= cur.total) {
            clearInterval(cur.autoplay);
            cur.autoplay = null;
          } else {
            cur.step += 1;
          }
          render();
        }, 800);
      }
      render();
    }

    async function generateReview(force) {
      const rp = state.replay;
      if (!rp) return;
      rp.reviewLoading = true;
      render();
      try {
        const res = await api(`/games/${rp.gameId}/review`, {
          method: 'POST', body: JSON.stringify({ force: !!force }),
        });
        rp.review = res.review;
        toast('AI 点评已生成', 'success');
      } catch (e) {
        toast('点评生成失败: ' + e.message, 'error');

        rp.reviewLoading = false;
        render();
      }
    }

    // 损失分布图：黑方向上、白方向下的柱状条，高度按 log 归一化，颜色按失误分级
    function lossChart(moves) {
      if (!moves || moves.length === 0) return '<div class="empty" style="padding:18px 0">暂无分析数据</div>';
      const W = 320, H = 96, gap = 1.6;
      const bw = Math.max(1.5, (W - gap * (moves.length - 1)) / moves.length);
      const maxLoss = Math.max(1, ...moves.map(m => m.loss || 0));
      const denom = Math.log10(maxLoss + 1) || 1;
      const norm = l => Math.min(1, Math.log10((l || 0) + 1) / denom);
      const colors = { best: '#3ddc97', good: '#6fd3ff', inaccuracy: '#e8b45a', mistake: '#ff9b5a', blunder: '#ff6b6b' };
      const midY = H / 2;
      let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="逐手损失分布">`;
      svg += `<line x1="0" y1="${midY}" x2="${W}" y2="${midY}" stroke="rgba(148,163,184,.28)" stroke-width="1"/>`;
      moves.forEach((m, i) => {
        const h = norm(m.loss) * (midY - 5);
        const x = i * (bw + gap);
        const y = m.player === 1 ? midY - h : midY;
        svg += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(1, h).toFixed(2)}" fill="${colors[m.label] || '#6fd3ff'}" opacity=".88" rx="1"><title>第${m.move_no}手 ${m.player_name} · ${m.label_text}</title></rect>`;
      });
      svg += '</svg>';
      return svg;
    }

    function renderReplay() {
      const rp = state.replay;
      if (!rp) return '<div class="empty" style="padding:60px 20px">加载中…</div>';
      const g = rp.game;

      const history = g.history || [];
      const board = replayBoardAt(history, rp.step, size);
      const curMove = rp.step > 0 ? history[rp.step - 1] : null;
      const moves = rp.analysis?.moves || [];
      const cur = rp.step > 0 ? moves[rp.step - 1] : null;
      const finished = g.status === 'finished' || g.status === 'draw';

              ).join('') || '<span style="font-size:10.5px;color:var(--text-3)">无失误</span>'}
            </div>
            <div style="margin-top:7px;font-size:11px;color:var(--text-3)">
              ${Object.entries(p.phases || {}).map(([k, v]) => `${escapeHtml(k)} ${v.moves}手 / ${v.rating}分`).join(' · ')}
            </div>
          </div>`;
      };

      const reviewHTML = () => {

        }

            ${(rv.key_moments || []).length ? `<div style="margin-top:12px">
              ${rv.key_moments.map(km => `
                <div class="km-item">
                  <div class="km-head">第 ${km.move_no ?? '?'} 手 · ${escapeHtml(km.player || '')}</div>
                  <div class="km-text">${escapeHtml(km.comment || '')}</div>
                  ${km.better ? `<div class="km-better">→ ${escapeHtml(km.better)}</div>` : ''}
                </div>`).join('')}
            </div>` : ''}
            ${(rv.advice || []).length ? `<div style="margin-top:12px">
              <div style="font-size:12px;color:var(--amber);font-weight:700">改进建议</div>
              <ul class="advice-list">${rv.advice.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>
            </div>` : ''}
            <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              <span style="font-size:11px;color:var(--text-3)">点评：${escapeHtml(rv.reviewer || '')} · ${escapeHtml(rv.model || '')}</span>
              <button class="btn btn-ghost btn-sm" onclick="generateReview(true)">重新生成</button>
            </div>

      };

      return `
        <div class="replay-layout">
          <section class="game-main">
            <div class="board-wrap">
              <div class="board-frame">
                <div class="board-grid no-ghost" style="grid-template-columns:repeat(${size},1fr);background-size:calc(100% / ${size}) 100%, 100% calc(100% / ${size}), auto, auto">
                  ${(() => {
                    let h = '';
                    for (let r = 0; r < size; r++) {
                      for (let c = 0; c < size; c++) {
                        const cell = board[r][c];
                        const stone = cell === 1 ? 'black' : cell === 2 ? 'white' : '';
                        const isLast = curMove && curMove.row === r && curMove.col === c;
                        const isWin = winnerCells && winnerCells.some(([wr, wc]) => wr === r && wc === c);
                        const star = isStarCell(r, c, size) ? ' star' : '';
                        h += `<div class="board-cell${star}${stone ? ' has-stone' : ''}">${
                          stone ? `<div class="stone stone--${stone}${isLast ? ' stone--last' : ''}${isWin ? ' stone--win' : ''}"></div>` : ''
                        }</div>`;
                      }
                    }
                    return h;
                  })()}
                </div>

              <button class="btn btn-ghost btn-sm" onclick="replayStep(1)">下一手 ▶</button>
              <button class="btn btn-ghost btn-sm" onclick="replayGo(${rp.total})">⏭</button>
              <input type="range" class="step-slider" min="0" max="${rp.total}" value="${rp.step}"

              <span class="step-info">${rp.step} / ${rp.total} 手</span>
            </div>

            <div class="game-controls">
              <a class="btn btn-ghost" href="#game/${g.id}">← 返回对局</a>

            </div>

          <aside class="side-panel">

                  <span><i style="background:var(--amber)"></i>疑问</span>
                  <span><i style="background:#ff9b5a"></i>失误</span>
                  <span><i style="background:var(--red)"></i>败着</span>
                  <span style="margin-left:auto">上＝黑方 下＝白方</span>
                </div>
              </div>

            <div class="panel-card">

              <div style="padding:4px 14px 12px">

            <div class="panel-card">

                <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                <div class="run-meta">
                  <span>${r.size} 路</span>
                  <span>${r.forbidden ? '禁手' : '自由'}</span>
                  <span>${({ easy: '简单', normal: '普通', hard: '困难' })[r.difficulty] || r.difficulty}</span>
                  <span>手数上限 ${r.max_moves}</span>
                  ${running ? `<span>当前第 ${r.current_game} 局 · 已下 ${r.current_moves} 手</span>` : ''}
                  ${r.error ? `<span style="color:var(--red)">${escapeHtml(r.error)}</span>` : ''}
                </div>
                ${(r.games || []).length ? `<div class="run-meta" style="margin-top:10px">
                  ${r.games.map(gm => {
                    const txt = gm.result === 'draw' ? '平' : (gm.result === 'a' ? 'A胜' : 'B胜');
                    const col = gm.result === 'draw' ? 'var(--text-3)' : (gm.result === 'a' ? 'var(--green)' : 'var(--cyan)');
                    return `<a href="#replay/${gm.game_id}" style="color:${col};text-decoration:none;font-weight:700" title="第${gm.round_index}局，A执${gm.a_color === 1 ? '黑' : '白'}">#${gm.round_index} ${txt}</a>`;
                  }).join('')}
                </div>` : ''}
              </div>`;
          }).join('');

      return `
        <div class="config-wrap">
          <div class="card config-sec">
            <h3><span class="num">🏟️</span>发起擂台赛</h3>
            <div class="arena-form">
              <div class="field"><label>玩家 A</label><select class="select" onchange="setArenaForm('a', Number(this.value))">${playerOptions(f.a)}</select></div>
              <div class="field"><label>玩家 B</label><select class="select" onchange="setArenaForm('b', Number(this.value))">${playerOptions(f.b)}</select></div>
              <div class="field"><label>对局数</label><select class="select" onchange="setArenaForm('rounds', Number(this.value))">
                ${[2, 4, 6, 8, 10].map(n => `<option value="${n}" ${f.rounds === n ? 'selected' : ''}>${n} 局</option>`).join('')}
              </select></div>
              <div class="field"><label>单局手数上限</label><select class="select" onchange="setArenaForm('max_moves', Number(this.value))">
                ${[40, 60, 80, 120].map(n => `<option value="${n}" ${f.max_moves === n ? 'selected' : ''}>${n} 手</option>`).join('')}
              </select></div>
              ${arenaSeg('棋盘', 'size', [{ value: 15, text: '15 路' }, { value: 13, text: '13 路' }, { value: 9, text: '9 路' }])}
              ${arenaSeg('规则', 'forbidden', [{ value: 0, text: '自由' }, { value: 1, text: '禁手' }])}
              ${arenaSeg('难度', 'difficulty', [{ value: 'easy', text: '简单' }, { value: 'normal', text: '普通' }, { value: 'hard', text: '困难' }])}
            </div>
            <div class="create-actions">
              <button class="btn btn-primary" onclick="startArena()" ${data.running_id ? 'disabled' : ''}>
                ${data.running_id ? '有擂台赛进行中…' : '开始对弈'}
              </button>
            </div>
            <div class="opt-hint">
              对局在后台串行进行（避免触发 LLM 限流），双方轮流执黑以消除先手优势。
              <b>困难</b>难度为纯引擎对弈，速度最快；<b>普通 / 简单</b>会真实调用 LLM，一局可能耗时数分钟。
            </div>
          </div>

          <div class="card config-sec">
            <h3><span class="num">📋</span>擂台赛记录${data.running_id ? '<span class="spinner" style="margin-left:8px"></span>' : ''}</h3>
            <div class="cfg-list">${runsHTML}</div>
          </div>
        </div>`;
    }

    /* ==================== 系统状态（可观测性） ==================== */
    async function loadStats() {
      try {
        state.stats = await api('/stats/');
      } catch (e) {
        toast('系统状态加载失败: ' + e.message, 'error');
      }
    }

    function renderStats() {
      const s = state.stats || { models: [], totals: {} };
      const t = s.totals || {};
      const okRate = t.calls ? Math.round(t.ok / t.calls * 100) : 0;

      const rows = s.models.length === 0
        ? '<div class="empty">暂无 LLM 调用记录，先下一局或跑一次擂台赛</div>'
        : `
          <div class="table-wrap">
            <table class="hist-table">
              <thead><tr>
                <th>模型</th><th>配置</th><th>调用</th><th>成功</th>
                <th>超时</th><th>解析失败</th><th>未采纳</th><th>降级</th>
                <th>平均耗时</th><th>峰值</th>
              </tr></thead>
              <tbody>
                ${s.models.map(m => `
                  <tr>
                    <td><b>${escapeHtml(m.model_id)}</b>${(m.players || []).length ? `<div style="font-size:11px;color:var(--text-3)">${(m.players || []).map(p => escapeHtml(p)).join('、')}</div>` : ''}</td>
                    <td style="font-family:var(--font-mono);font-size:11.5px;color:var(--text-3);max-width:190px;overflow:hidden;text-overflow:ellipsis">${escapeHtml(m.config_name || m.base_url)}</td>
                    <td>${m.calls}</td>
                    <td>${m.ok}</td>
                    <td style="color:${m.timeout ? 'var(--red)' : 'var(--text-2)'}">${m.timeout}</td>
                    <td style="color:${m.parse_fail ? 'var(--amber)' : 'var(--text-2)'}">${m.parse_fail}</td>
                    <td>${m.rejected + m.fallback}</td>
                    <td>${m.degraded}</td>
                    <td>${m.avg_latency_ms} ms</td>
                    <td>${m.max_latency_ms} ms</td>
                  </tr>
                  <tr><td colspan="10" style="padding:0 12px 10px">
                    <div class="bar-track"><div class="bar-fill ${m.success_rate >= 90 ? 'bar-ok' : m.success_rate >= 60 ? 'bar-warn' : 'bar-bad'}" style="width:${Math.max(2, m.success_rate)}%"></div></div>
                    <div style="font-size:11px;color:var(--text-3);margin-top:4px">成功率 ${m.success_rate}%${m.last_error ? ` · 最近错误：${escapeHtml(m.last_error)}` : ''}</div>
                  </td></tr>
                `).join('')}
              </tbody>
            </table>
          </div>`;

      return `
        <div class="config-wrap">
          <div class="card config-sec">
            <h3><span class="num">📡</span>LLM 调用总览</h3>
            <div class="metric-grid">
              <div class="metric-item"><div class="metric-value">${t.calls ?? 0}</div><div class="metric-label">总调用</div></div>
              <div class="metric-item"><div class="metric-value" style="color:var(--green)">${okRate}%</div><div class="metric-label">成功率</div></div>
              <div class="metric-item"><div class="metric-value" style="color:${t.timeout ? 'var(--red)' : 'var(--text-1)'}">${t.timeout ?? 0}</div><div class="metric-label">超时</div></div>
              <div class="metric-item"><div class="metric-value" style="color:${t.parse_fail ? 'var(--amber)' : 'var(--text-1)'}">${t.parse_fail ?? 0}</div><div class="metric-label">解析失败</div></div>
              <div class="metric-item"><div class="metric-value">${(t.rejected ?? 0) + (t.fallback ?? 0)}</div><div class="metric-label">未采纳</div></div>
              <div class="metric-item"><div class="metric-value">${t.degraded ?? 0}</div><div class="metric-label">参数降级</div></div>
            </div>
            <div class="opt-hint">
              指标为进程内累计（重启即清零）。「未采纳」＝ LLM 给了坐标但不合法 / 评分不足而回退引擎；
              「参数降级」＝ 端点不支持 response_format 或 reasoning_effort 而自动降级的次数。
            </div>
            <div class="create-actions">
              <button class="btn btn-ghost btn-sm" onclick="loadStats().then(render)">刷新</button>
              <button class="btn btn-danger btn-sm" onclick="resetStats()">清空指标</button>
            </div>
          </div>
          <div class="card config-sec">
            <h3><span class="num">🔬</span>按模型明细</h3>
            ${rows}
          </div>
        </div>`;
    }

    async function resetStats() {
      const ok = await showModal({ title: '清空指标', message: '确认清空全部 LLM 调用统计？', confirmText: '清空', danger: true });
      if (!ok) return;
      try {
        await api('/stats/reset', { method: 'POST' });
        await loadStats();
        render();
        toast('指标已清空', 'success');
      } catch (e) {
        toast('清空失败: ' + e.message, 'error');
      }
    }

    /* ================= 历史页渲染 ================= */
    function renderHistory() {
      const data = state.history || { games: [], ranking: [] };

      const rankRows = data.ranking.length === 0
        ? '<div class="empty">暂无对局数据，先去下一局吧</div>'
        : data.ranking.map((r, i) => `
          <div class="rank-row ${i < 3 ? 'rank-top' : ''}">
            <span class="rank-badge">${i + 1}</span>
            <span class="rank-name">${escapeHtml(r.player)}</span>
            <span class="rank-stat">${r.games} 局</span>
            <span class="rank-stat">胜 ${r.wins}</span>
            <span class="rank-stat">负 ${r.losses}</span>
            <span class="rank-stat">平 ${r.draws}</span>
            <span class="rank-stat">胜率 ${r.win_rate}%</span>
            <span class="rank-points">${r.points} 分</span>
          </div>`).join('');

      const gameRows = data.games.length === 0
        ? '<tr><td colspan="7" class="empty">暂无已结束对局</td></tr>'
        : data.games.map(g => {
            const resultText = g.status === 'draw'
              ? '平局'
              : (g.winner === 1 ? `${escapeHtml(g.black)} 胜` : `${escapeHtml(g.white)} 胜`);
            let timeText = '—';
            if (g.created_at) {
              try {
                timeText = new Date(g.created_at).toLocaleString('zh-CN', { hour12: false }).slice(0, 16);
              } catch (_) { timeText = '—'; }
            }
            const modeText = MODES[g.mode] || '人机';
            return `<tr>
              <td>${timeText}</td>
              <td>${modeText}</td>
              <td>${escapeHtml(g.black)}</td>
              <td>${escapeHtml(g.white)}</td>
              <td>${g.stones}</td>
              <td>${resultText}</td>
              <td style="display:flex;gap:6px">
                <a class="btn btn-ghost btn-sm" href="#game/${g.id}?view=1">查看</a>
                <a class="btn btn-ghost btn-sm" href="#replay/${g.id}">复盘</a>
              </td>
            </tr>`;
          }).join('');

      return `
        <div class="config-wrap">
          <div class="card config-sec">
            <h3><span class="num">🏆</span>积分排名</h3>
            <div class="rank-list">${rankRows}</div>
          </div>
          <div class="card config-sec">
            <h3><span class="num">📜</span>对战历史</h3>
            <div class="table-wrap">
              <table class="hist-table">
                <thead><tr><th>时间</th><th>模式</th><th>黑方</th><th>白方</th><th>手数</th><th>结果</th><th></th></tr></thead>
                <tbody>${gameRows}</tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    /* ================= 配置页渲染 ================= */
    function renderConfig() {
      const selectedConfig = state.configs.find(c => c.id === state.selectedConfigId);
      const models = selectedConfig?.models || [];
      return `
        <div class="config-wrap">
          <div class="card config-sec">
            <h3><span class="num">1</span>模型配置</h3>
            <div class="form-grid">
              <div class="field"><label>配置名称</label><input class="input" id="cfg-name" placeholder="例如：DeepSeek" /></div>
              <div class="field"><label>Base URL</label><input class="input" id="cfg-url" placeholder="https://api.example.com/v1" /></div>
              <div class="field full"><label>API Key</label><input class="input" id="cfg-key" type="password" placeholder="sk-..." /></div>
            </div>
            <div class="create-actions">
              <button class="btn btn-primary" onclick="submitConfig()">添加配置</button>
            </div>
            <div class="cfg-list">
              ${state.configs.map(c => `
                <div class="cfg-card ${state.selectedConfigId === c.id ? 'selected' : ''}">
                  <div class="row1">
                    <div>
                      <div class="cname">${escapeHtml(c.name)}</div>
                      <div class="curl">${escapeHtml(c.base_url)}</div>
                      ${c.models?.length ? `<div class="cmodels"><b>✓</b> 已拉取 ${c.models.length} 个模型</div>` : '<div class="cmodels">尚未拉取模型</div>'}
                    </div>
                    <div class="cfg-actions">
                      <button class="btn btn-ghost btn-sm" onclick="testConfig(${c.id})">测试</button>
                      <button class="btn btn-ghost btn-sm" onclick="fetchModels(${c.id})">拉取模型</button>
                      <button class="btn btn-danger btn-sm" onclick="deleteConfig(${c.id})">删除</button>
                    </div>
                  </div>
                  ${c.models?.length ? `<div class="cmodels" style="margin-top:10px;padding:9px 11px;background:#0e1526;border-radius:8px">可用模型：<br><span style="color:var(--text-2);font-family:var(--font-mono)">${c.models.map(m => escapeHtml(m)).join(', ')}</span></div>` : ''}
                </div>
              `).join('') || '<div class="empty">暂无配置，请添加第一个模型配置</div>'}
            </div>
          </div>

          <div class="card config-sec">
            <h3><span class="num">2</span>AI 玩家</h3>
            <div class="form-grid">
              <div class="field"><label>玩家名称</label><input class="input" id="player-name" placeholder="例如：Alpha 弈" /></div>
              ${models.length > 0
                ? `<div class="field"><label>模型</label><select class="select" id="player-model">${models.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')}</select></div>`
                : `<div class="field"><label>模型 ID</label><input class="input" id="player-model" placeholder="请先选择配置并拉取模型" /></div>`}
              <div class="field">
                <label>思考等级</label>
                <select class="select" id="player-effort">
                  <option value="">默认（不设置）</option>
                  <option value="low">低</option>
                  <option value="medium">中</option>
                  <option value="high">高</option>
                </select>
              </div>
              <div class="field" style="display:flex;align-items:flex-end">
                <button class="btn btn-ghost btn-sm" id="btn-test-player" onclick="testPlayerLLM('player-model','player-effort',null,this)" style="width:100%">测试当前配置</button>

            </div>
            <div class="create-actions">
              <button class="btn btn-primary" onclick="submitPlayer()">添加玩家</button>

            <div class="player-list">

                  ).join('');
                  return `
                  <div class="cfg-card" style="border-color:rgba(232,180,90,.55);box-shadow:0 0 0 3px var(--amber-dim)">
                    <div class="cname" style="color:var(--amber)">编辑玩家 #${p.id}</div>
                    <div class="edit-box">
                      <div class="form-grid">
                        <div class="field"><label>玩家名称</label><input class="input" id="edit-player-name-${p.id}" value="${escapeHtml(p.name)}" /></div>
                        <div class="field"><label>模型配置</label>
                          <select class="select" id="edit-player-cfg-${p.id}">${cfgOptions}</select>
                        </div>
                        <div class="field"><label>模型 ID</label><input class="input" id="edit-player-model-${p.id}" value="${escapeHtml(p.model_id)}" /></div>
                        <div class="field">
                          <label>思考等级</label>
                          <select class="select" id="edit-player-effort-${p.id}">
                            <option value="" ${(p.reasoning_effort || '') === '' ? 'selected' : ''}>默认（不设置）</option>
                            <option value="low" ${p.reasoning_effort === 'low' ? 'selected' : ''}>低</option>
                            <option value="medium" ${p.reasoning_effort === 'medium' ? 'selected' : ''}>中</option>
                            <option value="high" ${p.reasoning_effort === 'high' ? 'selected' : ''}>高</option>
                          </select>
                        </div>
                        <div class="field" style="display:flex;align-items:flex-end">
                          <button class="btn btn-ghost btn-sm" onclick="testPlayerLLM('edit-player-model-${p.id}','edit-player-effort-${p.id}','edit-player-cfg-${p.id}',this)" style="width:100%">测试当前配置</button>
                        </div>
                      </div>
                      <div class="create-actions">
                        <button class="btn btn-primary btn-sm" onclick="savePlayerEdit(${p.id})">保存</button>
                        <button class="btn btn-ghost btn-sm" onclick="state.editingPlayerId=null;render()">取消</button>
                      </div>
                    </div>

                }
                return `
                <div class="player-card-row">
                  <div class="prow">
                    <div>
                      <div class="pname">${escapeHtml(p.name)}</div>
                      <div class="pmeta">${escapeHtml(p.model_id)} · ${escapeHtml(cfg?.name || '-')} · 思考 ${effortLabel(p.reasoning_effort)}</div>
                    </div>
                    <div class="row-actions">
                      <button class="btn btn-ghost btn-sm" onclick="state.editingPlayerId=${p.id};render()">编辑</button>
                      <button class="btn btn-danger btn-sm" onclick="deletePlayer(${p.id})">删除</button>
                    </div>
                  </div>

              }).join('') || '<div class="empty">暂无 AI 玩家，添加后可创建对局</div>'}
            </div>
            <div class="config-hint">
              <span>配置完成后，返回首页创建对局。</span>
              <a href="/" class="btn btn-primary btn-sm">前往创建对局 →</a>
            </div>
          </div>
        </div>`;
    }

    /* ================= 配置提交 ================= */
    async function submitConfig() {
      const name = document.getElementById('cfg-name').value;
      const baseUrl = document.getElementById('cfg-url').value;
      const apiKey = document.getElementById('cfg-key').value;
      if (!name || !baseUrl || !apiKey) return toast('请填写完整配置信息', 'error');
      await api('/configs/', { method: 'POST', body: JSON.stringify({ name, base_url: baseUrl, api_key: apiKey, models: [] }) });
      toast('模型配置已添加', 'success');
      await loadConfigs();
    }

    async function submitPlayer() {
      const nameEl = document.getElementById('player-name');
      const modelEl = document.getElementById('player-model');
      const name = nameEl?.value?.trim();
      const modelId = modelEl?.value?.trim();
      const reasoningEffort = document.getElementById('player-effort')?.value || '';
      const modelConfigId = state.selectedConfigId || (state.configs.length > 0 ? state.configs[0].id : null);
      if (!name) return toast('请输入玩家名称', 'error');
      if (!modelConfigId) return toast('请先添加模型配置', 'error');
      if (!modelId) return toast('请选择或输入模型 ID', 'error');
      await api('/players/', { method: 'POST', body: JSON.stringify({ name, model_config_id: modelConfigId, model_id: modelId, reasoning_effort: reasoningEffort }) });
      toast('AI 玩家已添加', 'success');
      await loadConfigs();
    }

    async function savePlayerEdit(id) {
      const name = document.getElementById(`edit-player-name-${id}`)?.value?.trim();
      const cfgEl = document.getElementById(`edit-player-cfg-${id}`);
      const modelId = document.getElementById(`edit-player-model-${id}`)?.value?.trim();
      const reasoningEffort = document.getElementById(`edit-player-effort-${id}`)?.value || '';
      if (!name) return toast('请输入玩家名称', 'error');
      const modelConfigId = cfgEl ? Number(cfgEl.value) : null;
      if (!modelConfigId) return toast('请选择模型配置', 'error');
      if (!modelId) return toast('请输入模型 ID', 'error');
      try {
        await api(`/players/${id}`, {
          method: 'PUT',
          body: JSON.stringify({ name, model_config_id: modelConfigId, model_id: modelId, reasoning_effort: reasoningEffort })
        });
        state.editingPlayerId = null;
        await loadConfigs();
        toast('玩家已更新', 'success');
      } catch (e) {
        toast('保存失败: ' + e.message, 'error');
      }
    }

    // 测试"模型配置 + 模型 + 思考等级"能否连通（思考等级下拉旁的测试按钮）
    async function testPlayerLLM(modelIdElId, effortElId, cfgIdOrEl, btn) {
      const modelId = document.getElementById(modelIdElId)?.value?.trim();
      const effort = document.getElementById(effortElId)?.value || '';
      let cfgId = cfgIdOrEl;
      if (typeof cfgIdOrEl === 'string') cfgId = document.getElementById(cfgIdOrEl)?.value;
      if (!cfgId) cfgId = state.selectedConfigId || (state.configs.length > 0 ? state.configs[0].id : null);
      if (!cfgId) return toast('请先添加模型配置', 'error');
      if (!modelId) return toast('请选择或输入模型 ID', 'error');
      if (btn) { btn.disabled = true; btn.textContent = '测试中…'; }
      try {
        const res = await api('/players/test_llm', { method: 'POST', body: JSON.stringify({ model_config_id: Number(cfgId), model_id: modelId, reasoning_effort: effort }) });
        if (res.status === 'ok') {
          toast('✅ ' + res.detail, 'success');
        } else {
          toast(res.detail || '测试失败', 'error');
        }
      } catch (e) {
        toast('测试失败: ' + e.message, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = '测试当前配置'; }
      }
    }

    /* ================= 终局回顾 / 重新开始 / 返回 ================= */
    // 首页：查看已结束房间的对局（通过 hash 导航进对局页并打开只读回顾）
    async function viewRoomGame(roomId) {
      const room = state.rooms.find(r => r.id === roomId);
      if (!room || !room.game_id) return toast('该房间暂无对局可查看', 'error');
      location.href = `#game/${room.game_id}?view=1`; // 使用 URL 参数避免竞态条件
    }
    // 查看已结束棋局（只读：棋盘 + AI 思考日志 + 终局信息）
    async function viewFinishedGame() {
      state._viewingResult = true;
      // SSE 只推送最近 10 条日志，回顾时拉取全量 logs
      try {
        const fresh = await api(`/games/${state.game.id}/state`);
        if (fresh && Array.isArray(fresh.logs)) state.logs = fresh.logs;
      } catch (_) { /* 拉取失败则用当前已有日志 */ }
      render();
    }
    // 从回顾模式返回终局面板
    function closeViewFinished() {
      state._viewingResult = false;
      render();
    }

    async function restartGame() {
      const ok = await showModal({
        title: '重新开始',
        message: '确认开启一局新的对弈？当前对局记录将保留在历史中。',
        confirmText: '开始新对局',
      });
      if (!ok || !state.game) return;
      const btn = document.getElementById('btn-restart');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> 开局中…'; }
      try {
        const res = await api(`/rooms/${state.game.room_id}/start`, { method: 'POST' });
        // 导航前先彻底清理旧对局的 SSE / 心跳 / 状态，避免旧局(game_over)的延迟推送
        // 覆盖新局，确保进入的是全新的一局而非终局棋盘。
        if (state._es) { state._es.close(); state._es = null; }
        if (state._hb) { clearInterval(state._hb); state._hb = null; }
        state.game = null;
        state.logs = [];
        state.currentRoom = null;
        state._boardKey = '';
        location.href = `#game/${res.game_id}`;
      } catch (e) {
        toast('重新开始失败: ' + e.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '重新开始'; }
      }
    }

    function goHome() {
      location.href = '/';
    }

    /* ================= 路由渲染 ================= */
    async function render() {
      const hash = location.hash;
      const app = document.getElementById('app');

      // 离开游戏页面时清理 SSE 连接与心跳定时器（防资源泄漏）
      const leavingGame = !hash.startsWith('#game');
      const leavingReplay = !hash.startsWith('#replay');
      if (leavingGame && leavingReplay) {
        if (state._es) {
          state._es.close();
          state._es = null;
        }
        if (state._hb) {
          clearInterval(state._hb);
          state._hb = null;
        }
      }
      // 离开对局页时清理复盘自动播放定时器
      if (leavingReplay && state.replay?.autoplay) {
        clearInterval(state.replay.autoplay);
        state.replay.autoplay = null;
      }
      // 离开擂台赛页时停止进度轮询
      if (!hash.startsWith('#arena') && state._arenaTimer) {
        clearInterval(state._arenaTimer);
        state._arenaTimer = null;
      }
      // 如果当前不在游戏页面且不在配置页面，清理 game 状态
      if (leavingGame && leavingReplay && !hash.startsWith('#config')) {
        state.game = null;
        state.logs = [];
        state.currentRoom = null;
        state._boardKey = '';
        state.replay = null;
      }

      const topbar = (title, right) => `
        <header class="topbar">
          <a class="brand" href="/" aria-label="返回首页">
            <span class="brand-logo"></span>
            <span>
              <span class="brand-name">弈境<em>·</em>五子棋</span>
              <div class="brand-sub">AI Gomoku</div>
            </span>
          </a>
          <div class="topbar-right">${right || ''}</div>
        </header>`;

      if (hash.startsWith('#config')) {
        app.innerHTML = topbar('配置', '<a class="btn btn-ghost btn-sm" href="/">返回首页</a>') + renderConfig();
      } else if (hash.startsWith('#game')) {
        const parts = hash.split('/');
        const id = Number(parts[1]);
        // 检查 URL 参数中的 view=1 标志
        const urlParams = new URLSearchParams(hash.split('?')[1] || '');
        const viewMode = urlParams.get('view') === '1';
        if (id && !isNaN(id)) {
          if (!state.game || state.game.id !== id) {
            if (state._es) {
              state._es.close();
              state._es = null;
            }
            if (state._hb) {
              clearInterval(state._hb);
              state._hb = null;
            }
            state.game = null;
            state.logs = [];
            state._boardKey = '';
            state._viewingResult = viewMode; // 从 URL 参数设置回顾模式
            await loadGame(id);
          } else if (viewMode) {
            state._viewingResult = true; // 切换到回顾模式
          }
          app.innerHTML = topbar('对局', `<span class="game-chip">对局 #${id}</span><a class="btn btn-ghost btn-sm" href="/">返回</a>`) + renderGame();
        } else {
          app.innerHTML = topbar('无效对局', '') + '<div class="empty" style="padding:60px 20px">无效的对局链接，请从首页进入。</div>';
        }
      } else if (hash.startsWith('#history')) {
        // 历史页：对战历史 + 积分排名
        try {
          state.history = await api('/history/');
        } catch (e) {
          /* 拉取失败保留旧数据 */
        }
        app.innerHTML = topbar('历史', '<a class="btn btn-ghost btn-sm" href="/">返回首页</a>') + renderHistory();
      } else if (hash.startsWith('#arena')) {
        await loadArena();
        app.innerHTML = topbar('擂台赛', '<a class="btn btn-ghost btn-sm" href="/">返回首页</a>') + renderArena();
        // 有擂台赛在跑时每 3 秒刷新进度
        if (state.arena?.running_id && !state._arenaTimer) {
          state._arenaTimer = setInterval(async () => {
            if (!location.hash.startsWith('#arena')) return;
            await loadArena();
            if (!state.arena?.running_id) {
              clearInterval(state._arenaTimer);
              state._arenaTimer = null;
            }
            if (location.hash.startsWith('#arena')) {
              document.getElementById('app').innerHTML =
                topbar('擂台赛', '<a class="btn btn-ghost btn-sm" href="/">返回首页</a>') + renderArena();
            }
          }, 3000);
        }
      } else if (hash.startsWith('#stats')) {
        await loadStats();
        app.innerHTML = topbar('系统状态', '<a class="btn btn-ghost btn-sm" href="/">返回首页</a>') + renderStats();
      } else if (hash.startsWith('#replay')) {
        const id = Number((hash.split('/')[1] || '').split('?')[0]);
        if (!id || isNaN(id)) {
          app.innerHTML = topbar('复盘', '<a class="btn btn-ghost btn-sm" href="/">返回首页</a>') +
            '<div class="empty" style="padding:60px 20px">无效的复盘链接。</div>';
          return;
        }
        if (!state.replay || state.replay.gameId !== id) {
          await loadReplay(id);
        }
        app.innerHTML = topbar('复盘', `<span class="game-chip">对局 #${id}</span><a class="btn btn-ghost btn-sm" href="/">返回首页</a>`) + renderReplay();
      } else {
        // 首页：先刷新房间列表（反映 waiting/playing 最新状态，支持退出后按钮切换）
        try {
          state.rooms = await api('/rooms/');
        } catch (e) {
          /* 拉取失败保留旧数据 */
        }
        app.innerHTML = topbar('首页', '<a class="btn btn-ghost btn-sm" href="#config">⚙️ 配置管理</a><a class="btn btn-ghost btn-sm" href="#arena">🏟️ 擂台赛</a><a class="btn btn-ghost btn-sm" href="#history">📊 历史</a><a class="btn btn-ghost btn-sm" href="#stats">📡 状态</a>') + renderHome();
      }
    }

    location.hash = '';
    loadConfigs();
    loadRooms();
    window.addEventListener('hashchange', render);
    // 页面关闭/刷新前清理 SSE 连接与心跳定时器，避免连接泄漏
    window.addEventListener('beforeunload', () => {
      if (state._es) { try { state._es.close(); } catch (_) {} state._es = null; }
      if (state._hb) { clearInterval(state._hb); state._hb = null; }
    });
  </script>
</body>
</html>
