[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gomoku-backend"
version = "1.0.0"
description = "AI Gomoku backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.9.0",
    "sqlalchemy==2.0.51",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "sse-starlette==2.0.0",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
